<title>NSY Measurement Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap">
<style>
/* NSY Measurement Board.
   Dark product surface, committed to a single theme. Card idiom on a
   blue-cast near black ground, after the supplied reference. */

:root {
  color-scheme: dark;

  /* Three surfaces and nothing else. Depth comes from tone, so no card
     carries a shadow. */
  --bg: #0B0D12;

  /* Cards are a translucent white over the page colour, not a solid fill,
     so a card reads as a lit surface rather than an outlined box. */
  --surf-1: rgba(255, 255, 255, 0.03);    /* level 1, the KPI cards */
  --surf-1-hi: rgba(255, 255, 255, 0.055);/* raised: hovered, or wanting attention */
  --surf-2: rgba(255, 255, 255, 0.02);    /* level 2, the chart and the lists */
  --ring-1: rgba(255, 255, 255, 0.14);    /* top of the ring on a level 1 card */
  --ring-2: rgba(255, 255, 255, 0.08);    /* and on a level 2 card */
  --dot-bg: #0E1017;                      /* backing behind the chart end point */

  --line: rgba(255, 255, 255, 0.09);
  --line-hi: rgba(255, 255, 255, 0.15);

  --text: #E9ECF2;
  --muted: #8C95A6;
  --faint: #7A8394;

  --pos: #3EC27A;
  --neg: #EF5D4A;
  --hold: #D9A036;

  /* One accent, pulled back. */
  --blue: #7C82E8;
  --brand: #7C82E8;
  --spark: #6E7688;     /* sparklines are furniture, not the story */

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --rail: 262px;
  --r-card: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(88% 52% at 50% -14%, #10131B 0%, rgba(11, 13, 18, 0) 64%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(124, 130, 232, 0.30); }

.num { font-variant-numeric: tabular-nums; }

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}

:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------- Rail ---------- */

.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
  border-right: 1px solid var(--line);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rail::-webkit-scrollbar { width: 8px; }
.rail::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 999px; }
.rail::-webkit-scrollbar-track { background: transparent; }

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 10px 26px;
}

.brand-mark { height: 26px; width: auto; display: block; flex: none; }
.brand .name { font-size: 15.5px; font-weight: 500; letter-spacing: -0.01em; }

.nav { display: flex; flex-direction: column; gap: 2px; }

.nav button {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 14.5px;
  color: var(--muted);
  transition: background 0.14s ease, color 0.14s ease;
}

.nav button:hover { background: rgba(255, 255, 255, 0.035); color: var(--text); }

.nav button[aria-current="page"] {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-weight: 500;
}

/* A thin accent line at the left rather than a heavier fill. */
.nav button[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: -14px;
  top: 7px;
  bottom: 7px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: var(--brand);
}

.nav button[aria-current="page"] svg { color: var(--brand); }

.nav svg { flex: none; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

.user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 10px 2px;
  border-top: 1px solid var(--line);
}

.avatar {
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line-hi);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.user .who { line-height: 1.3; }
.user .who b { display: block; font-size: 13.5px; font-weight: 500; }
.user .who span { font-size: 12px; color: var(--faint); }

/* ---------- Main and page head ---------- */

.main { padding: 30px 40px 72px; min-width: 0; }

.page-head {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 24px;
}

.head-left { display: flex; align-items: flex-start; gap: 14px; }

h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.page-head .sub { margin: 9px 0 0; font-size: 14px; color: var(--muted); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 11px 3px 9px;
  vertical-align: 5px;
  margin-left: 12px;
}

.pill::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 6px rgba(81, 103, 246, 0.8);
}

.head-right { text-align: right; }

.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  background: var(--surf-1);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.seg button {
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: background 0.14s ease, color 0.14s ease;
}

.seg button:hover { color: var(--text); }

.seg button[aria-pressed="true"],
.seg button[aria-selected="true"] {
  background: rgba(255, 255, 255, 0.07);
  color: var(--text);
}

.stamp { margin: 14px 0 0; font-size: 13px; color: var(--faint); }

.menu {
  display: none;
  flex: none;
  padding: 7px;
  margin: -3px 0 0 -7px;
  border-radius: 8px;
  color: var(--muted);
}

.menu:hover { background: var(--surf-1-hi); color: var(--text); }

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}

/* ---------- Cards ----------
   No border and no shadow. A 1px ring sits on the card's edge, bright at
   the top and gone by the bottom, so the light appears to come from above.
   The ring is a pseudo element masked down to its own padding, which is
   why both mask-composite lines are needed: xor for Chrome and Safari,
   exclude for Firefox. */

.card,
.tile {
  position: relative;
  background: var(--surf-1);
  border: 1px solid rgba(255, 255, 255, 0.06);  /* fallback, dropped below */
  border-radius: var(--r-card);
}

@supports ((-webkit-mask-composite: xor) or (mask-composite: exclude)) {
  .card,
  .tile { border: 0; }

  .card::before,
  .tile::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    pointer-events: none;
    background: linear-gradient(180deg, var(--ring-1), rgba(255, 255, 255, 0) 92%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  /* A quieter ring on the level 2 surfaces. */
  .detail::before,
  .behind::before,
  .rows-card::before,
  .trendrows::before,
  .ehead::before {
    background: linear-gradient(180deg, var(--ring-2), rgba(255, 255, 255, 0) 92%);
  }

  .open-question::before {
    background: linear-gradient(180deg, rgba(217, 160, 54, 0.32), rgba(217, 160, 54, 0) 92%);
  }
}

/* Attention is a lighter fill. The ring does not change. */
.card.attention,
.tile.attention { background: var(--surf-1-hi); }

/* The chart and the supporting lists sit a level quieter than the KPI cards,
   so the six numbers stay the loudest thing on the page. */
.detail, .behind, .rows-card, .trendrows, .ehead { background: var(--surf-2); }

/* ---------- Tiles ---------- */

.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.tile {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 24px 26px 22px;
  overflow: hidden;
  transition: background 0.18s ease;
}

/* Raised, not lit. The card under the cursor takes the same lighter fill
   an attention card does. */
.tile:hover { background: var(--surf-1-hi); }

.t-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.t-label {
  font-size: 14px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.t-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-top: 22px;
}

.t-value {
  display: block;
  font-size: 42px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: -0.035em;
  white-space: nowrap;
}

.t-value .unit {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted);
  margin-left: 4px;
}

.t-foot {
  display: flex;
  align-items: baseline;
  gap: 9px;
  min-width: 0;
  font-size: 13px;
  color: var(--faint);
}

.t-foot > span:last-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

@media (max-width: 1180px) {
  .t-bottom { flex-wrap: wrap; }
  .spark-box { width: 100%; }
}

.delta { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
/* A variance never breaks across two lines, it gives up room instead. */
.t-foot > .delta { flex: none; white-space: nowrap; }
.delta.good { color: var(--pos); }
.delta.bad { color: var(--neg); }

/* Small, grey and tucked away, so the number carries the card. It gives
   up width before the reading beside it does. */
.spark-box { display: block; width: 96px; height: 32px; flex: none; opacity: 0.85; }
@media (max-width: 1420px) { .spark-box { width: 68px; } }
.spark-box svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- Chart card ---------- */

.detail {
  margin-top: 16px;
  padding: 24px 28px 20px;
}

.detail-head {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}

/* One sentence saying what the shape means, so the chart is not left to
   speak for itself. */
.chart-read {
  margin: 0 0 30px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 82ch;
}

.detail-head h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }

.legend { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--faint); }
.legend .dash { width: 20px; height: 0; border-top: 1.5px dashed var(--line-hi); }

.chart { position: relative; padding-left: 54px; padding-right: 124px; }

.plot { position: relative; height: 300px; }

.gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.gridline.target { border-top: 1.5px dashed rgba(160, 176, 210, 0.28); }

.ylabel {
  position: absolute;
  left: -54px;
  width: 42px;
  text-align: right;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--faint);
}

.plot-svg { position: absolute; inset: 0; }
.plot-svg svg { display: block; width: 100%; height: 100%; overflow: visible; }

.grid-layer { position: absolute; inset: 0; }

/* The label layer cross fades while the line morphs underneath it. */
.grid-layer,
#chartTitle,
#chartLegend,
#callout,
#behindCard {
  transition: opacity 0.16s ease;
}

.is-out { opacity: 0; }

/* Hover readout. The probe catches the pointer; the hit test against the
   drawn curve happens in script, so this only appears near the line. */
.probe { position: absolute; inset: 0; cursor: crosshair; }

.hover-dot,
.hover-tip {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease;
}

.hover-dot {
  width: 11px;
  height: 11px;
  margin: -5.5px 0 0 -5.5px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--blue);
  box-shadow: 0 0 0 4px rgba(124, 130, 232, 0.16);
}

.hover-tip {
  transform: translate(-50%, -100%);
  margin-top: -16px;
  background: #161A24;
  border: 1px solid var(--line-hi);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}

.plot.probing .hover-dot,
.plot.probing .hover-tip { opacity: 1; }

.plot.probing .callout { opacity: 0; }

.callout {
  position: absolute;
  left: calc(100% + 18px);
  transform: translateY(-50%);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.35;
}

.callout b { font-weight: 500; }
.callout small { display: block; margin-top: 3px; font-size: 12px; font-weight: 400; color: var(--faint); }

.xaxis {
  position: relative;
  height: 18px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--faint);
}

.xaxis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.xaxis .x-first { transform: none; }
.xaxis .x-last { transform: translateX(-100%); color: var(--muted); }

/* ---------- Supporting measures ---------- */

.behind { margin-top: 16px; padding: 22px 28px 24px; }

.behind h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
.behind .note { margin: 0 0 18px; font-size: 13px; color: var(--muted); max-width: 76ch; }

.support {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 48px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.support li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.support .s-owner { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; }
.support .s-fig { text-align: right; white-space: nowrap; font-weight: 500; }
.support .s-fig small { display: block; font-size: 12px; font-weight: 400; color: var(--faint); }
.support .s-fig.miss small { color: var(--neg); }
.support .s-fig.hit small { color: var(--pos); }

.method {
  margin-top: 22px;
  padding: 16px 18px;
  background: var(--surf-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.method p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; max-width: 84ch; color: var(--muted); }
.method p:last-child { margin-bottom: 0; }
.method p b { color: var(--text); font-weight: 500; }

/* ---------- Definition state, quiet ---------- */

.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--faint);
  white-space: nowrap;
}

.state::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-sizing: border-box;
}

.state.drafting { color: var(--hold); }
.state.manual::before { background: transparent; border: 1px solid currentColor; }

/* ---------- Team ---------- */

.role-note { margin: 18px 0 16px; font-size: 14px; color: var(--muted); max-width: 78ch; }

.rows-card { padding: 4px 24px; }

.mrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px 132px 74px;
  gap: 10px 28px;
  align-items: center;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}

.mrow:first-child { border-top: none; }

.m-name {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 14px;
  font-weight: 500;
  margin: 0;
}

.m-def { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 64ch; }

.bar { height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--pos); }
.bar.miss i { background: var(--neg); }

.m-fig { text-align: right; white-space: nowrap; }
.m-fig .v { font-size: 19px; font-weight: 500; letter-spacing: -0.02em; }
.m-fig .v.miss { color: var(--neg); }
.m-fig .t { display: block; font-size: 12px; color: var(--faint); }

.src { font-size: 13px; color: var(--faint); justify-self: end; }
.src:hover { color: var(--text); }
.src[aria-expanded="true"] { color: var(--blue); }

.src-panel { grid-column: 1 / -1; padding: 2px 0 6px 14px; border-left: 1px solid var(--line-hi); }
.src-panel p { margin: 0 0 6px; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 84ch; }
.src-panel p:last-child { margin-bottom: 0; }
.src-panel .open { color: var(--hold); }

.open-question { margin-top: 16px; padding: 22px 26px; border-color: rgba(217, 160, 54, 0.22); }
.open-question h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--hold); }
.open-question p { margin: 0 0 10px; font-size: 14px; line-height: 1.65; max-width: 80ch; color: var(--muted); }
.open-question p:last-child { margin-bottom: 0; }
.open-question p b { color: var(--text); font-weight: 500; }

.cadence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.cadence article { padding: 20px 22px; }
.cadence h4 { margin: 0 0 3px; font-size: 12px; font-weight: 500; color: var(--faint); }
.cadence .when { margin: 0 0 7px; font-size: 15px; font-weight: 500; }
.cadence p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

/* ---------- Stub pages ---------- */

.stub { padding: 28px 30px; max-width: 70ch; }
.stub h2 { margin: 0 0 8px; font-size: 19px; font-weight: 500; }
.stub p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (max-width: 1180px) {
  .support { grid-template-columns: 1fr; }
  .cadence { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }

  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 272px;
    z-index: 40;
    background: var(--bg);
    transform: translateX(-100%);
    transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .rail {
    visibility: hidden;
    transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1), visibility 0s linear 0.26s;
  }

  body.nav-open .rail { transform: none; visibility: visible; transition-delay: 0s; }

  .head-right { width: 100%; text-align: left; }
  .stamp { margin-top: 8px; }

  .seg.roles { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg.roles::-webkit-scrollbar { display: none; }
  .seg.roles button { white-space: nowrap; flex: none; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  body.nav-open { overflow: hidden; }

  .menu { display: inline-flex; }

  .main { padding: 22px 18px 56px; }
  .tiles { grid-template-columns: 1fr; }
  .detail, .behind { padding: 20px 18px 18px; }
  .chart { padding-left: 46px; padding-right: 18px; }
  .ylabel { left: -46px; width: 36px; }
  .callout { display: none; }
  .xaxis .x-minor { display: none; }
  .mrow { grid-template-columns: minmax(0, 1fr) 110px; }
  .mrow .bar { grid-column: 1; }
  .src { justify-self: start; grid-column: 1 / -1; }
}

/* ---------- KPI detail pages ---------- */

.back {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 18px;
  padding: 6px 12px 6px 9px;
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: color 0.14s ease, border-color 0.14s ease, background 0.14s ease;
}

.back:hover { color: var(--text); border-color: var(--line-hi); background: var(--surf-1-hi); }
.back svg { flex: none; }

.hero {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 14px 22px;
