<title>NSY Measurement Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* NSY Measurement Board.
   Dark product surface, committed to a single theme. Card idiom on a
   blue-cast near black ground, after the supplied reference. */

:root {
  color-scheme: dark;

  --bg: #0A0C10;
  --well: #0C0F14;
  --card: #10131A;
  --card-hi: #141821;
  --raise: #1B1F28;

  --line: rgba(160, 176, 210, 0.10);
  --line-hi: rgba(160, 176, 210, 0.20);

  --text: #E9ECF2;
  --muted: #8C95A6;
  --faint: #7A8394;

  --pos: #3EC27A;
  --neg: #EF5D4A;
  --hold: #D9A036;
  --blue: #7A94FF;
  --brand: #5167F6;

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --rail: 262px;
  --r-card: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(90% 55% at 50% -12%, #12161F 0%, rgba(10, 12, 16, 0) 62%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(111, 140, 255, 0.28); }

.num { font-variant-numeric: tabular-nums; }

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}

:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------- Rail ---------- */

.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
  border-right: 1px solid var(--line);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rail::-webkit-scrollbar { width: 8px; }
.rail::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 999px; }
.rail::-webkit-scrollbar-track { background: transparent; }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 22px;
}

.brand-mark { height: 22px; width: auto; display: block; flex: none; }
.brand .name { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }

.nav { display: flex; flex-direction: column; gap: 2px; }

.nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 14.5px;
  color: var(--muted);
  transition: background 0.14s ease, color 0.14s ease;
}

.nav button:hover { background: rgba(255, 255, 255, 0.035); color: var(--text); }

.nav button[aria-current="page"] {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  font-weight: 500;
}

.nav svg { flex: none; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

.user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 10px 2px;
  border-top: 1px solid var(--line);
}

.avatar {
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line-hi);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.user .who { line-height: 1.3; }
.user .who b { display: block; font-size: 13.5px; font-weight: 500; }
.user .who span { font-size: 12px; color: var(--faint); }

/* ---------- Main and page head ---------- */

.main { padding: 30px 40px 72px; min-width: 0; }

.page-head {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 24px;
}

.head-left { display: flex; align-items: flex-start; gap: 14px; }

h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.page-head .sub { margin: 5px 0 0; font-size: 14px; color: var(--muted); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 11px 3px 9px;
  vertical-align: 5px;
  margin-left: 12px;
}

.pill::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 6px rgba(81, 103, 246, 0.8);
}

.head-right { text-align: right; }

.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  background: var(--well);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.seg button {
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: background 0.14s ease, color 0.14s ease;
}

.seg button:hover { color: var(--text); }

.seg button[aria-pressed="true"],
.seg button[aria-selected="true"] {
  background: var(--raise);
  color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
}

.stamp { margin: 10px 0 0; font-size: 13px; color: var(--faint); }

.menu {
  display: none;
  flex: none;
  padding: 7px;
  margin: -3px 0 0 -7px;
  border-radius: 8px;
  color: var(--muted);
}

.menu:hover { background: var(--card); color: var(--text); }

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}

/* ---------- Cards ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
}

/* ---------- Tiles ---------- */

.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.tile {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 22px 24px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  overflow: hidden;
  transition: background 0.18s ease, border-color 0.18s ease;
}

.tile:hover { background: var(--card-hi); border-color: var(--line-hi); }

.t-label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }

.t-value {
  display: block;
  font-size: 42px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: -0.035em;
  white-space: nowrap;
}

.t-value .unit {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted);
  margin-left: 4px;
}

.t-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 13px;
  color: var(--faint);
}

.delta { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
.delta.good { color: var(--pos); }
.delta.bad { color: var(--neg); }

.spark-box { display: block; height: 60px; margin-top: 12px; }
.spark-box svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- Chart card ---------- */

.detail {
  margin-top: 16px;
  padding: 24px 28px 20px;
}

.detail-head {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 26px;
}

.detail-head h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }

.legend { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--faint); }
.legend .dash { width: 20px; height: 0; border-top: 1.5px dashed var(--line-hi); }

.chart { position: relative; padding-left: 54px; padding-right: 124px; }

.plot { position: relative; height: 300px; }

.gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.gridline.target { border-top: 1.5px dashed rgba(160, 176, 210, 0.28); }

.ylabel {
  position: absolute;
  left: -54px;
  width: 42px;
  text-align: right;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--faint);
}

.plot-svg { position: absolute; inset: 0; }
.plot-svg svg { display: block; width: 100%; height: 100%; overflow: visible; }

.grid-layer { position: absolute; inset: 0; }

/* The label layer cross fades while the line morphs underneath it. */
.grid-layer,
#chartTitle,
#chartLegend,
#callout,
#behindCard {
  transition: opacity 0.16s ease;
}

.is-out { opacity: 0; }

/* Hover readout. The probe catches the pointer; the hit test against the
   drawn curve happens in script, so this only appears near the line. */
.probe { position: absolute; inset: 0; cursor: crosshair; }

.hover-dot,
.hover-tip {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease;
}

.hover-dot {
  width: 11px;
  height: 11px;
  margin: -5.5px 0 0 -5.5px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--blue);
  box-shadow: 0 0 0 4px rgba(122, 148, 255, 0.16);
}

.hover-tip {
  transform: translate(-50%, -100%);
  margin-top: -16px;
  background: #171B24;
  border: 1px solid var(--line-hi);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}

.plot.probing .hover-dot,
.plot.probing .hover-tip { opacity: 1; }

.plot.probing .callout { opacity: 0; }

.callout {
  position: absolute;
  left: calc(100% + 16px);
  transform: translateY(-50%);
  background: #171B24;
  border: 1px solid var(--line-hi);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}

.xaxis {
  position: relative;
  height: 18px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--faint);
}

.xaxis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.xaxis .x-first { transform: none; }
.xaxis .x-last { transform: translateX(-100%); color: var(--muted); }

/* ---------- Supporting measures ---------- */

.behind { margin-top: 16px; padding: 22px 28px 24px; }

.behind h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
.behind .note { margin: 0 0 18px; font-size: 13px; color: var(--muted); max-width: 76ch; }

.support {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 48px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.support li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.support .s-owner { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; }
.support .s-fig { text-align: right; white-space: nowrap; font-weight: 500; }
.support .s-fig small { display: block; font-size: 12px; font-weight: 400; color: var(--faint); }
.support .s-fig.miss small { color: var(--neg); }
.support .s-fig.hit small { color: var(--pos); }

.method {
  margin-top: 22px;
  padding: 16px 18px;
  background: var(--well);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.method p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; max-width: 84ch; color: var(--muted); }
.method p:last-child { margin-bottom: 0; }
.method p b { color: var(--text); font-weight: 500; }

/* ---------- Definition state, quiet ---------- */

.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--faint);
  white-space: nowrap;
}

.state::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-sizing: border-box;
}

.state.drafting { color: var(--hold); }
.state.manual::before { background: transparent; border: 1px solid currentColor; }

/* ---------- Team ---------- */

.role-note { margin: 18px 0 16px; font-size: 14px; color: var(--muted); max-width: 78ch; }

.rows-card { padding: 4px 24px; }

.mrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px 132px 74px;
  gap: 10px 28px;
  align-items: center;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}

.mrow:first-child { border-top: none; }

.m-name {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 14px;
  font-weight: 500;
  margin: 0;
}

.m-def { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 64ch; }

.bar { height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--pos); }
.bar.miss i { background: var(--neg); }

.m-fig { text-align: right; white-space: nowrap; }
.m-fig .v { font-size: 19px; font-weight: 500; letter-spacing: -0.02em; }
.m-fig .v.miss { color: var(--neg); }
.m-fig .t { display: block; font-size: 12px; color: var(--faint); }

.src { font-size: 13px; color: var(--faint); justify-self: end; }
.src:hover { color: var(--text); }
.src[aria-expanded="true"] { color: var(--blue); }

.src-panel { grid-column: 1 / -1; padding: 2px 0 6px 14px; border-left: 1px solid var(--line-hi); }
.src-panel p { margin: 0 0 6px; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 84ch; }
.src-panel p:last-child { margin-bottom: 0; }
.src-panel .open { color: var(--hold); }

.open-question { margin-top: 16px; padding: 22px 26px; border-color: rgba(217, 160, 54, 0.18); }
.open-question h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--hold); }
.open-question p { margin: 0 0 10px; font-size: 14px; line-height: 1.65; max-width: 80ch; color: var(--muted); }
.open-question p:last-child { margin-bottom: 0; }
.open-question p b { color: var(--text); font-weight: 500; }

.cadence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.cadence article { padding: 20px 22px; }
.cadence h4 { margin: 0 0 3px; font-size: 12px; font-weight: 500; color: var(--faint); }
.cadence .when { margin: 0 0 7px; font-size: 15px; font-weight: 500; }
.cadence p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

/* ---------- Stub pages ---------- */

.stub { padding: 28px 30px; max-width: 70ch; }
.stub h2 { margin: 0 0 8px; font-size: 19px; font-weight: 500; }
.stub p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (max-width: 1180px) {
  .support { grid-template-columns: 1fr; }
  .cadence { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }

  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 272px;
    z-index: 40;
    background: var(--bg);
    transform: translateX(-100%);
    transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .rail {
    visibility: hidden;
    transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1), visibility 0s linear 0.26s;
  }

  body.nav-open .rail { transform: none; visibility: visible; transition-delay: 0s; }

  .head-right { width: 100%; text-align: left; }
  .stamp { margin-top: 8px; }

  .seg.roles { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg.roles::-webkit-scrollbar { display: none; }
  .seg.roles button { white-space: nowrap; flex: none; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  body.nav-open { overflow: hidden; }

  .menu { display: inline-flex; }

  .main { padding: 22px 18px 56px; }
  .tiles { grid-template-columns: 1fr; }
  .detail, .behind { padding: 20px 18px 18px; }
  .chart { padding-left: 46px; padding-right: 18px; }
  .ylabel { left: -46px; width: 36px; }
  .callout { display: none; }
  .xaxis .x-minor { display: none; }
  .mrow { grid-template-columns: minmax(0, 1fr) 110px; }
  .mrow .bar { grid-column: 1; }
  .src { justify-self: start; grid-column: 1 / -1; }
}

/* ---------- KPI detail pages ---------- */

.back {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 18px;
  padding: 6px 12px 6px 9px;
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: color 0.14s ease, border-color 0.14s ease, background 0.14s ease;
}

.back:hover { color: var(--text); border-color: var(--line-hi); background: var(--card); }
.back svg { flex: none; }

.hero {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 14px 22px;
  padding: 26px 30px 24px;
}

.hero .h-val {
  font-size: 52px;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1;
}

.hero .h-val .unit {
  font-size: 22px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: -0.02em;
  margin-left: 4px;
}

.hero .h-meta { display: flex; flex-direction: column; gap: 5px; padding-bottom: 4px; }
.hero .h-meta .delta { font-size: 14px; }
.hero .h-meta .h-tgt { font-size: 13px; color: var(--faint); }
.hero .h-intro {
  flex: 1 1 320px;
  margin: 0;
  padding-bottom: 4px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 58ch;
}

.statstrip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-top: 14px;
}

.stat { padding: 18px 20px 17px; }
.stat .s-lab { display: block; font-size: 13px; color: var(--muted); margin-bottom: 9px; }
.stat .s-val { display: block; font-size: 26px; font-weight: 500; letter-spacing: -0.025em; }
.stat .s-sub { display: block; margin-top: 6px; font-size: 12.5px; color: var(--faint); }
.stat.pos .s-sub { color: var(--pos); }
.stat.neg .s-sub { color: var(--neg); }

.sect { margin-top: 26px; }
.sect > h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.sect > .s-note { margin: 0 0 14px; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 80ch; }
.sect > h3 + .card, .sect > h3 + .scroll-x { margin-top: 14px; }

.scroll-x { overflow-x: auto; border-radius: var(--r-card); }
.scroll-x::-webkit-scrollbar { height: 8px; }
.scroll-x::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
.scroll-x::-webkit-scrollbar-track { background: transparent; }

table.dt {
  width: 100%;
  min-width: 560px;
  border-collapse: collapse;
  background: var(--card);
  border-radius: var(--r-card);
  overflow: hidden;
  font-size: 13.5px;
}

table.dt th,
table.dt td {
  padding: 12px 16px;
  text-align: left;
  border-top: 1px solid var(--line);
  white-space: nowrap;
}

table.dt thead th {
  border-top: none;
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
  letter-spacing: 0.02em;
  padding-top: 15px;
  padding-bottom: 11px;
}

table.dt tbody tr:hover td { background: var(--card-hi); }
table.dt th.r, table.dt td.r { text-align: right; }
table.dt td.name { color: var(--text); }
table.dt td.dim { color: var(--muted); }
table.dt td.pos { color: var(--pos); }
table.dt td.neg { color: var(--neg); }

table.dt tr.total td {
  border-top: 1px solid var(--line-hi);
  font-weight: 500;
  background: rgba(255, 255, 255, 0.022);
}

table.dt tr.rule td { border-top: 1px solid var(--line-hi); font-weight: 500; }

.sub-lab { display: block; margin-top: 3px; font-size: 11.5px; color: var(--faint); }

/* The score grid. Three bands rather than a continuous ramp, because the
   point is to find the bad ones at a glance, not to admire a gradient. */
table.dt td.cell { text-align: right; color: var(--muted); }
table.dt td.cell.good { color: var(--pos); background: rgba(62, 194, 122, 0.09); }
table.dt td.cell.bad { color: var(--neg); background: rgba(239, 93, 74, 0.10); }
table.dt td.cell.none { color: var(--faint); }
table.dt td.avg { text-align: right; font-weight: 500; color: var(--text); }

.trendrows { padding: 4px 24px; }

.trow {
  display: grid;
  grid-template-columns: minmax(160px, 1.5fr) minmax(90px, auto) minmax(84px, auto) minmax(120px, 1.1fr);
  align-items: center;
  gap: 18px;
  padding: 15px 0;
  border-top: 1px solid var(--line);
}

.trow:first-child { border-top: none; }
.trow .tr-name { font-size: 13.5px; }
.trow .tr-val { font-size: 19px; font-weight: 500; letter-spacing: -0.02em; text-align: right; }
.trow .tr-d { font-size: 13px; justify-self: end; }
.trow .tr-spark { height: 34px; }
.trow .tr-spark svg { display: block; width: 100%; height: 100%; overflow: visible; }

.caveat {
  margin-top: 12px;
  padding: 14px 18px;
  border: 1px solid rgba(217, 160, 54, 0.28);
  border-radius: 12px;
  background: rgba(217, 160, 54, 0.05);
  font-size: 13px;
  line-height: 1.65;
  color: var(--muted);
  max-width: 82ch;
}

.caveat b { color: var(--hold); font-weight: 500; }

.tile { cursor: pointer; }

@media (max-width: 860px) {
  .hero { padding: 22px 22px 20px; }
  .hero .h-val { font-size: 40px; }
  .trow {
    grid-template-columns: 1fr auto;
    gap: 8px 14px;
  }
  .trow .tr-spark { grid-column: 1 / -1; }
  .trow .tr-d { grid-column: 2; justify-self: end; }
}


/* ---------- Entity end point pages ---------- */

.crumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--faint);
}

.crumbs button {
  padding: 5px 8px;
  border-radius: 7px;
  font-size: 13px;
  color: var(--muted);
  transition: background 0.14s ease, color 0.14s ease;
}

.crumbs button:hover { background: var(--card); color: var(--text); }
.crumbs .sep { opacity: 0.5; padding: 0 1px; }
.crumbs .here { padding: 5px 8px; color: var(--text); }

.ehead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px 26px;
  padding: 24px 30px 22px;
}

.ehead h2 { margin: 0 0 7px; font-size: 26px; font-weight: 500; letter-spacing: -0.025em; }
.ehead .e-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13.5px; color: var(--muted); }
.ehead .e-meta b { color: var(--text); font-weight: 500; }
.ehead .e-right { text-align: right; }
.ehead .e-big { display: block; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.ehead .e-cap { display: block; margin-top: 6px; font-size: 12.5px; color: var(--faint); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}

.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.chip.good { color: var(--pos); border-color: rgba(62, 194, 122, 0.3); }
.chip.bad { color: var(--neg); border-color: rgba(239, 93, 74, 0.3); }
.chip.hold { color: var(--hold); border-color: rgba(217, 160, 54, 0.32); }

/* A row that opens something deeper. Underline only on hover, so a table of
   thirty of them does not turn into a wall of blue. */
.go {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  color: var(--text);
  padding: 0;
  text-align: left;
}

.go:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.go::after {
  content: "";
  width: 5px; height: 5px;
  border-right: 1.4px solid currentColor;
  border-top: 1.4px solid currentColor;
  transform: rotate(45deg);
  opacity: 0;
  transition: opacity 0.14s ease;
}
.go:hover::after { opacity: 0.7; }
table.dt tbody tr:hover .go::after { opacity: 0.45; }

.empty {
  padding: 18px 20px;
  font-size: 13.5px;
  color: var(--muted);
}

@media (max-width: 860px) {
  .ehead { padding: 20px 20px 18px; }
  .ehead h2 { font-size: 21px; }
  .ehead .e-right { text-align: left; }
}

</style>
</head>

/* ---------- End point pages ----------
   A client, a person, a pod or a cost line. Every one is built from the same
   section shapes as the pages above it, so the board reads as one thing. */

var MN = DEEP.months;

function gbp(n) { return '£' + Math.round(n).toLocaleString('en-GB'); }
function one(n) { return (Math.round(n * 10) / 10).toFixed(1); }

/* Sparklines want a continuous run. Trim to the months the entity actually
   existed and carry any gap forward, because the table under it holds the
   month by month truth. */
function compact(series) {
  var a = 0, b = series.length - 1;
  while (a < series.length && series[a] === null) a++;
  while (b >= 0 && series[b] === null) b--;
  if (a > b) return null;
  var out = [], last = series[a];
  for (var i = a; i <= b; i++) {
    if (series[i] !== null) last = series[i];
    out.push(last);
  }
  return { v: out, from: MN[a], to: MN[b], a: a, b: b };
}

function trendRow(name, series, fmt, goodUp, pad) {
  var c = compact(series);
  if (!c || c.v.length < 2) return null;
  var n = c.v.length;
  var now = c.v[n - 1], prev = c.v[n - 2];
  var d = now - prev;
  var lo = Math.min.apply(null, c.v), hi = Math.max.apply(null, c.v);
  var p = pad === undefined ? Math.max((hi - lo) * 0.35, Math.abs(hi) * 0.04 || 1) : pad;
  return {
    name: name, value: fmt(now), series: c.v, lo: lo - p, hi: hi + p,
    deltaDir: d > 0.0001 ? 'up' : d < -0.0001 ? 'down' : 'flat',
    deltaText: Math.abs(d) < 0.0001 ? 'level' : fmt(Math.abs(d)),
    deltaGood: d === 0 ? true : (d > 0) === goodUp
  };
}

function trendsOf(rows, title, note) {
  rows = rows.filter(Boolean);
  if (!rows.length) return null;
  return { title: title, note: note || '', kind: 'trends', trends: rows };
}

/* ---------- who is who ---------- */

var INDEX = null;

function buildIndex() {
  if (INDEX) return INDEX;
  INDEX = {};
  function add(label, kind, id) { INDEX[label.toLowerCase()] = { kind: kind, id: id }; }
  Object.keys(DEEP.clients).forEach(function (id) { add(DEEP.clients[id].name, 'client', id); });
  Object.keys(DEEP.people).forEach(function (id) { add(DEEP.people[id].name, 'person', id); });
  Object.keys(DEEP.cost).forEach(function (id) { add(DEEP.cost[id].name, 'cost', id); });
  DEEP.pods.forEach(function (p) { add(p.name, 'pod', p.id); });
  return INDEX;
}

/* Table labels carry extra words: "Less editor payroll", "Editor payroll, 16
   people". Strip those before looking the row up. */
function entityFor(label) {
  var s = String(label || '').trim()
    .replace(/^Less\s+/i, '')
    .replace(/,\s*\d+\s+people$/i, '')
    .replace(/\s*\(subtotal\)$/i, '')
    .replace(/,\s*the six lines above$/i, '');
  return buildIndex()[s.toLowerCase()] || null;
}

function goLink(label, ent) {
  return '<button type="button" class="go" data-go="' + ent.kind + ':' + ent.id + '">' + esc(label) + '</button>';
}

/* ---------- pod roll ups ---------- */

function podPeople(podName) {
  return Object.keys(DEEP.people).map(function (id) { return DEEP.people[id]; })
    .filter(function (p) { return p.pod === podName; });
}

function podClients(podName) {
  return Object.keys(DEEP.clients).map(function (id) { return DEEP.clients[id]; })
    .filter(function (c) { return c.pod === podName; });
}

function meanAt(list, pick, i) {
  var v = [];
  list.forEach(function (x) { var n = pick(x, i); if (n !== null && n !== undefined) v.push(n); });
  if (!v.length) return null;
  return v.reduce(function (a, b) { return a + b; }, 0) / v.length;
}

function podSeries(podName) {
  var pe = podPeople(podName), cl = podClients(podName), i;
  var mrr = [], csat = [], perf = [], sat = [], chk = [];
  for (i = 0; i < 12; i++) {
    mrr.push(cl.reduce(function (a, c) { return a + c.retainer[i]; }, 0));
    csat.push(meanAt(cl, function (c, k) { return c.sat[k]; }, i));
    perf.push(meanAt(pe, function (p, k) { return p.perf[k]; }, i));
    sat.push(meanAt(pe, function (p, k) { return p.sat[k]; }, i));
    var f = 0, d = 0;
    pe.forEach(function (p) { if (p.filed[i]) { f += p.filed[i][0]; d += p.filed[i][1]; } });
    chk.push(d ? (f / d) * 100 : null);
  }
  return { mrr: mrr, csat: csat, perf: perf, sat: sat, chk: chk, people: pe, clients: cl };
}

/* ---------- the four page shapes ---------- */

function monthGrid(title, note, qs, rows, bad, good, blank, avgLabel) {
  return {
    title: title, note: note || '', kind: 'grid',
    columns: ['Month'].concat(qs).concat([avgLabel || 'Average']),
    rowLabels: MN.slice(), sublabels: [],
    values: rows, bad: bad, good: good, nullLabel: blank
  };
}

function clientPage(id) {
  var c = DEEP.clients[id];
  var i, secs = [];
  var months = c.retainer.filter(function (v) { return v > 0; }).length;
  var billed = c.retainer.reduce(function (a, b) { return a + b; }, 0);
  var replies = c.sat.filter(function (v) { return v !== null; }).length;
  var live = c.retainer[11] > 0;
  var latest = null;
  for (i = 11; i >= 0; i--) if (c.sat[i] !== null) { latest = i; break; }

  var stats = [
    { label: live ? 'Monthly retainer' : 'Retainer when it ended',
      value: gbp(live ? c.retainer[11] : c.retainer[c.last]),
      sub: live ? (c.tenure + ' months with NSY') : ('Lost in ' + MN[Math.min(11, c.last + 1)]),
      tone: live ? 'flat' : 'neg' },
    { label: 'Billed in the twelve months', value: gbp(billed),
      sub: months + ' of 12 months on the book', tone: 'flat' },
    { label: 'Latest satisfaction',
      value: latest === null ? 'None' : one(c.sat[latest]),
      sub: latest === null ? 'Never returned a form' : (MN[latest] + ', against a target of 8.5'),
      tone: latest === null ? 'neg' : (c.sat[latest] >= 8.5 ? 'pos' : 'neg') },
    { label: 'Forms returned', value: replies + ' of ' + months,
      sub: replies === months ? 'Answered every month' : ((months - replies) + ' months with no answer'),
      tone: replies === months ? 'pos' : 'neg' }
  ];

  var rows = [];
  for (i = 0; i < 12; i++) {
    rows.push(c.q[i] ? c.q[i].concat([c.sat[i]]) : new Array(DEEP.clientQ.length + 1).fill(null));
  }
  secs.push(monthGrid('Every score this client has given',
    'The six questions on the monthly form, month by month. A blank row is a month with no form returned, not a bad month.',
    DEEP.clientQ, rows, 8.0, 9.0, 'Not returned'));

  var rt = [];
  for (i = 0; i < 12; i++) {
    if (!c.retainer[i]) { rt.push({ cells: [MN[i], 'Not a client', '', ''], tone: 'none' }); continue; }
    var prev = i > 0 ? c.retainer[i - 1] : 0;
    var ch = prev ? c.retainer[i] - prev : null;
    rt.push({ cells: [MN[i], gbp(c.retainer[i]),
      ch === null ? 'First month' : (ch === 0 ? 'No change' : (ch > 0 ? 'Up ' : 'Down ') + gbp(Math.abs(ch))),
      c.sat[i] === null ? 'No form' : one(c.sat[i])],
      tone: ch === null ? 'none' : ch > 0 ? 'pos' : ch < 0 ? 'neg' : 'none' });
  }
  rt.push({ cells: ['Total billed', gbp(billed), '', ''], tone: 'none' });

var PAGEFN = { client: clientPage, person: personPage, pod: podPage, cost: costPage };
function esc(s) {

}

function icon(name) {

function arrow(dir) {

function kpiById(id) {

function reduceMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* Monotone cubic through the points: smooth, but it never overshoots a
   value, so the curve does not invent a peak between two months. */
function monotone(pts) {
  var n = pts.length;
  if (n < 2) return '';
  var xs = pts.map(function (p) { return p[0]; });
  var ys = pts.map(function (p) { return p[1]; });
  var dx = [], m = [], t = [], i;
  for (i = 0; i < n - 1; i++) {
    dx[i] = xs[i + 1] - xs[i];
    m[i] = (ys[i + 1] - ys[i]) / (dx[i] || 1);
  }
  t[0] = m[0];
  for (i = 1; i < n - 1; i++) t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
  t[n - 1] = m[n - 2];
  for (i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    var a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { var tau = 3 / Math.sqrt(s); t[i] = tau * a * m[i]; t[i + 1] = tau * b * m[i]; }
  }
  var d = 'M' + xs[0].toFixed(2) + ' ' + ys[0].toFixed(2);
  for (i = 0; i < n - 1; i++) {
    var h = dx[i];
    d += ' C' + (xs[i] + h / 3).toFixed(2) + ' ' + (ys[i] + t[i] * h / 3).toFixed(2)
      + ',' + (xs[i + 1] - h / 3).toFixed(2) + ' ' + (ys[i + 1] - t[i + 1] * h / 3).toFixed(2)
      + ',' + xs[i + 1].toFixed(2) + ' ' + ys[i + 1].toFixed(2);
  }
  return d;
}

/* Sparklines are scaled to the metric's own range, not to the series'
   extremes, so a small drift reads as small and a large climb as large. */
function sparkMarkup(series, lo, hi, W, H, gid) {
  var span = (hi - lo) || 1;
  var padT = 8, padB = 6, padR = 6;
  var n = series.length;
  var pts = series.map(function (v, i) {
    return [(i / (n - 1)) * (W - padR), padT + (1 - (v - lo) / span) * (H - padT - padB)];
  });
  var last = pts[n - 1];
  var line = monotone(pts);
  var area = line + ' L' + last[0].toFixed(2) + ' ' + H + ' L0 ' + H + ' Z';

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
    + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#7A94FF" stop-opacity="0.22"/>'
    + '<stop offset="100%" stop-color="#7A94FF" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="' + area + '" fill="url(#' + gid + ')"/>'
    + '<path d="' + line + '" fill="none" stroke="#7A94FF" stroke-width="1.5"'
    + ' stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="3" fill="#F4F6FA"/>'
    + '</svg>';
}

function drawSpark(el, k) {
  var W = el.clientWidth, H = el.clientHeight;
  if (!W || !H) return;
  el.innerHTML = sparkMarkup(k.series, k.domain[0], k.domain[1], W, H, 'sg-' + k.id);
}

/* ---------- The chart ----------
   Built once and updated in place, so changing measure can morph from
   the shape already on screen rather than cutting to the new one. */

var CH = { pts: null, id: null, raf: 0, token: 0, xToY: null, W: 0, H: 0 };

function ptsFor(k, W, H) {
  var lo = k.domain[0], hi = k.domain[1], span = hi - lo || 1, n = k.series.length;
  return k.series.map(function (v, i) {
    return [(i / (n - 1)) * W, (1 - (v - lo) / span) * H];
  });
}

function ensureSvg(W, H) {
  var host = document.getElementById('plotSvg');
  if (!host) return null;
  if (host.firstChild && host.getAttribute('data-w') === String(W) && host.getAttribute('data-h') === String(H)) {
    return host;
  }
  host.setAttribute('data-w', W);
  host.setAttribute('data-h', H);
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
    + '<defs>'
    + '<linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#7A94FF" stop-opacity="0.26"/>'
    + '<stop offset="100%" stop-color="#7A94FF" stop-opacity="0"/>'
    + '</linearGradient>'
    + '<filter id="glow" x="-10%" y="-40%" width="120%" height="180%">'
    + '<feGaussianBlur stdDeviation="6"/></filter>'
    + '</defs>'
    + '<path class="c-area" fill="url(#cg)"/>'
    + '<path class="c-glow" fill="none" stroke="#7A94FF" stroke-opacity="0.32" stroke-width="10"'
    + ' stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>'
    + '<path class="c-line" fill="none" stroke="#7A94FF" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle class="c-halo" r="9" fill="#7A94FF" fill-opacity="0.22"/>'
    + '<circle class="c-ring" r="5.5" fill="#0A0C10" stroke="#7A94FF" stroke-width="2"/>'
    + '</svg>';
  return host;
}

function paint(pts, W, H) {
  var host = ensureSvg(W, H);
  if (!host) return;
  var line = monotone(pts);
  var last = pts[pts.length - 1];
  host.querySelector('.c-area').setAttribute('d', line + ' L' + W + ' ' + H + ' L0 ' + H + ' Z');
  host.querySelector('.c-glow').setAttribute('d', line);
  host.querySelector('.c-line').setAttribute('d', line);
  var halo = host.querySelector('.c-halo'), ring = host.querySelector('.c-ring');
  halo.setAttribute('cx', last[0].toFixed(2)); halo.setAttribute('cy', last[1].toFixed(2));
  ring.setAttribute('cx', last[0].toFixed(2)); ring.setAttribute('cy', last[1].toFixed(2));
  var cal = document.getElementById('callout');
  if (cal) cal.style.top = last[1].toFixed(2) + 'px';
}

/* Sample the drawn line so hovering tests against the curve itself
   rather than against the whole plot rectangle. */
function buildProbe(W) {
  CH.xToY = null;
  var host = document.getElementById('plotSvg');
  var path = host && host.querySelector('.c-line');
  if (!path || !path.getTotalLength) return;
  var len = path.getTotalLength();
  if (!len) return;
  var table = new Float32Array(W + 1);
  var x;
  for (x = 0; x <= W; x++) table[x] = -1;
  var steps = Math.max(W, 200) * 2;
  for (var i = 0; i <= steps; i++) {
    var p = path.getPointAtLength((i / steps) * len);
    var xr = Math.round(p.x);
    if (xr >= 0 && xr <= W) table[xr] = p.y;
  }
  var seen = -1;
  for (x = 0; x <= W; x++) {
    if (table[x] < 0) table[x] = seen; else seen = table[x];
  }
  CH.xToY = table;
}

function easeInOut(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function setKpi(id, animate) {
  var k = kpiById(id);
  var plot = document.getElementById('plot');
  if (!k || !plot) return;
  selectedKpi = id;

  var W = plot.clientWidth, H = plot.clientHeight;
  if (!W || !H) return;

  var target = ptsFor(k, W, H);
  var from = (CH.pts && CH.pts.length === target.length && CH.W === W && CH.H === H) ? CH.pts : null;
  var token = ++CH.token;
  var changed = CH.id !== id;
  CH.id = id;
  CH.W = W;
  CH.H = H;

  hideReadout();
  if (changed) swapLabels(k, token, animate);

  if (CH.raf) { cancelAnimationFrame(CH.raf); CH.raf = 0; }

  if (!animate || !from || reduceMotion()) {
    CH.pts = target;
    paint(target, W, H);
    buildProbe(W);
    return;
  }

  var start = null, dur = 520;
  function step(ts) {
    if (token !== CH.token) return;
    if (start === null) start = ts;
    var t = Math.min(1, (ts - start) / dur);
    var e = easeInOut(t);
    var now = target.map(function (p, i) {
      return [p[0], from[i][1] + (p[1] - from[i][1]) * e];
    });
    CH.pts = now;
    paint(now, W, H);
    if (t < 1) {
      CH.raf = requestAnimationFrame(step);
    } else {
      CH.raf = 0;
      CH.pts = target;
      paint(target, W, H);
      buildProbe(W);
    }
  }
  CH.raf = requestAnimationFrame(step);
}

/* Title, legend, axis labels and the supporting card cross fade while
   the line morphs underneath them. */
function swapLabels(k, token, animate) {
  var title = document.getElementById('chartTitle');
  var legend = document.getElementById('chartLegend');
  var grid = document.getElementById('gridLayer');
  var cal = document.getElementById('callout');
  var behindCard = document.getElementById('behindCard');
  if (!title || !legend || !grid || !cal) return;

  var lo = k.domain[0], hi = k.domain[1], span = hi - lo || 1;
  var yOf = function (v) { return (1 - (v - lo) / span) * 100; };

  function write() {
    title.textContent = k.chartTitle;
    legend.innerHTML = (k.target === null ? '' : '<span class="dash"></span>') + esc(k.targetLabel);
    grid.innerHTML = k.ticks.map(function (tk) {
      return '<div class="gridline" style="top:' + yOf(tk).toFixed(2) + '%"></div>'
        + '<div class="ylabel" style="top:' + yOf(tk).toFixed(2) + '%">' + esc(k.fmt(tk)) + '</div>';
    }).join('') + (k.target === null ? ''
      : '<div class="gridline target" style="top:' + yOf(k.target).toFixed(2) + '%"></div>');
    cal.textContent = k.value + k.unit;
    if (behindCard) behindCard.innerHTML = behind(k);
  }

  if (!animate || reduceMotion()) { write(); return; }

  var fading = [title, legend, grid, cal];
  if (behindCard) fading.push(behindCard);
  fading.forEach(function (el) { el.classList.add('is-out'); });
  setTimeout(function () {
    if (token !== CH.token) return;
    write();
    fading.forEach(function (el) { el.classList.remove('is-out'); });
  }, 140);
}

/* ---------- Hover readout ---------- */

var NEAR = 30;

function hideReadout() {
  var plot = document.getElementById('plot');
  if (plot) plot.classList.remove('probing');
}

function moveReadout(e) {
  var plot = document.getElementById('plot');
  if (!plot || !CH.xToY || !CH.pts) return;
  var r = plot.getBoundingClientRect();
  var x = Math.max(0, Math.min(CH.W, e.clientX - r.left));
  var y = e.clientY - r.top;
  var lineY = CH.xToY[Math.round(x)];

  if (lineY < 0 || Math.abs(y - lineY) > NEAR) { hideReadout(); return; }

  /* The marker rides the line under the pointer. The figure it carries
     is the month the pointer is nearest, so it steps as you cross into
     the next one rather than sliding through values never measured. */
  var k = kpiById(CH.id);
  var n = k.series.length;
  var i = Math.max(0, Math.min(n - 1, Math.round((x / CH.W) * (n - 1))));

  var dot = document.getElementById('hoverDot');
  var tip = document.getElementById('hoverTip');
  dot.style.left = x.toFixed(2) + 'px';
  dot.style.top = lineY.toFixed(2) + 'px';
  tip.textContent = MONTHS[i] + ' · ' + k.fmtPoint(k.series[i]);
  tip.style.top = lineY.toFixed(2) + 'px';
  tip.style.left = Math.max(46, Math.min(CH.W - 46, x)).toFixed(2) + 'px';
  plot.classList.add('probing');
}

/* ---------- KPI detail pages ----------
   A page is a hero, a strip of sub figures, the twelve month chart, then
   the sections that break the number apart. Sections come in three
   shapes: rows carrying a sparkline, a plain table, and a score grid. */

var TRENDS = [];

/* Right align a column when its figures are numbers, leave it left when
   they are words, so the tables set themselves without hand tuning. */
/* "No form" and "Not graded" mark an absence, not a word, so they should not
   drag a column of figures over to the left. */
var ABSENT = /^(no form|not returned|not graded|none|not a client|not here yet|n\/a)$/i;

function numericCol(rows, i) {
  var seen = 0, num = 0;
  rows.forEach(function (r) {
    var c = r.cells[i];
    if (c === undefined || c === null || c === '') return;
    if (ABSENT.test(String(c).trim())) return;
    seen++;
    if (/^[-+(]?[£$]?[\d.,]+%?\)?( pts)?$/.test(String(c).trim())) num++;
  });
  return seen > 0 && num / seen > 0.6;
}

function rowClass(cells) {
  var first = String(cells[0] || '').trim();
  if (/^Total\b/i.test(first)) return ' class="total"';
  if (/^(Operating profit|Delivery margin|Gross margin|Net)\b/i.test(first)) return ' class="rule"';
  return '';
}

function tableSection(sec) {
  var cols = sec.columns || [];
  var rows = sec.rows || [];
  var right = cols.map(function (c, i) { return i > 0 && numericCol(rows, i); });

  return '<div class="scroll-x"><table class="dt"><thead><tr>'
    + cols.map(function (c, i) {
        return '<th' + (right[i] ? ' class="r"' : '') + ' scope="col">' + esc(c) + '</th>';
      }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function (r) {
        var last = r.cells.length - 1;
        return '<tr' + rowClass(r.cells) + '>'
          + r.cells.map(function (c, i) {
              var cls = [];
              if (right[i]) cls.push('r');
              if (i === 0) cls.push('name');
              else if (!right[i]) cls.push('dim');
              if (i === last && r.tone && r.tone !== 'none') cls.push(r.tone);
              cls.push('num');
              var ent = i === 0 ? entityFor(c) : null;
              return '<td class="' + cls.join(' ') + '">' + (ent ? goLink(c, ent) : esc(c)) + '</td>';
            }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
}

/* Three bands, not a gradient. Coloured by what the score means against
   its target rather than by where it falls on a ramp, so a genuinely bad
   cell cannot clamp to the floor and read as merely poor. */
function band(v, bad, good) {
  if (v < bad) return 'bad';
  if (v >= good) return 'good';
  return '';
}

function gridSection(sec) {
  var cols = sec.columns || [];
  var labels = sec.rowLabels || [];
  var subs = sec.sublabels || [];
  var vals = sec.values || [];
  var bad = sec.bad, good = sec.good;
  var blank = sec.nullLabel || 'Not returned';

  return '<div class="scroll-x"><table class="dt"><thead><tr>'
    + cols.map(function (c, i) {
        return '<th' + (i > 0 ? ' class="r"' : '') + ' scope="col">' + esc(c) + '</th>';
      }).join('')
    + '</tr></thead><tbody>'
    + labels.map(function (name, r) {
        var row = vals[r] || [];
        var last = row.length - 1;
        var ge = entityFor(name);
        return '<tr><td class="name">' + (ge ? goLink(name, ge) : esc(name))
          + (subs[r] ? '<span class="sub-lab">' + esc(subs[r]) + '</span>' : '') + '</td>'
          + row.map(function (v, i) {
              if (v === null || v === undefined) {
                return i === last ? '<td class="cell none">' + esc(blank) + '</td>' : '<td class="cell none"></td>';
              }
              if (i === last) return '<td class="avg num">' + v.toFixed(1) + '</td>';
              return '<td class="cell num ' + band(v, bad, good) + '">' + v.toFixed(1) + '</td>';
            }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
}

function trendsSection(sec) {
  return '<div class="card trendrows">'
    + (sec.trends || []).map(function (t) {
        var i = TRENDS.push({ series: t.series, lo: t.lo, hi: t.hi }) - 1;
        return '<div class="trow">'
          + '<span class="tr-name">' + esc(t.name) + '</span>'
          + '<span class="tr-val num">' + esc(t.value) + '</span>'
          + '<span class="tr-d delta ' + (t.deltaGood ? 'good' : 'bad') + '">'
          + arrow(t.deltaDir)
          + '<span class="sr-only">' + (t.deltaDir === 'up' ? 'Up ' : t.deltaDir === 'down' ? 'Down ' : '') + '</span>'
          + esc(t.deltaText) + '</span>'
          + '<span class="tr-spark" data-tr="' + i + '"></span>'
          + '</div>';
      }).join('')
    + '</div>';
}

function section(sec) {
  var body = sec.kind === 'trends' ? trendsSection(sec)
    : sec.kind === 'grid' ? gridSection(sec)
    : tableSection(sec);

  return '<section class="sect">'
    + '<h3>' + esc(sec.title) + '</h3>'
    + (sec.note ? '<p class="s-note">' + esc(sec.note) + '</p>' : '')
    + body
    + (sec.caveat ? '<p class="caveat"><b>Worth knowing.</b> ' + esc(sec.caveat) + '</p>' : '')
    + '</section>';
}

function kpiPage() {
  var k = kpiById(openKpi);
  var d = DETAIL[openKpi];
  TRENDS = [];

  var hero = '<section class="card hero">'
    + '<span class="h-val num">' + esc(k.value)

    + '<span class="h-meta">'
    + '<span class="delta ' + (k.delta.good ? 'good' : 'bad') + '">' + arrow(k.delta.dir)
    + '<span class="sr-only">' + (k.delta.dir === 'up' ? 'Up ' : 'Down ') + '</span>'
    + esc(k.delta.text) + '</span>'
    + '<span class="h-tgt">' + esc(k.targetLabel) + '</span>'
    + '</span>'
    + '<p class="h-intro">' + esc(d ? d.intro : k.definition) + '</p>'
    + '</section>';

  var stats = d && d.stats && d.stats.length

            + '<span class="s-lab">' + esc(x.label) + '</span>'

    + ' stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'

function crumbs(here) {

  return out + '<span class="sep">/</span><span class="here">' + esc(here) + '</span></nav>';
}

function entityPage() {
  var fn = PAGEFN[openEntity.kind];
  var store = openEntity.kind === 'cost' ? DEEP.cost
    : openEntity.kind === 'person' ? DEEP.people
    : openEntity.kind === 'client' ? DEEP.clients : null;
  if (!fn || (store && !store[openEntity.id])) {
    return crumbs('Not found') + '<div class="card stub"><h2>Nothing here</h2>'
      + '<p>That page does not exist. Go back to the overview.</p></div>';
  }
  var d = fn(openEntity.id);
  TRENDS = [];
  return crumbs(d.title)
    + d.head
    + (d.note ? '<p class="caveat"><b>Worth knowing.</b> ' + esc(d.note) + '</p>' : '')
    + (d.stats && d.stats.length ? '<div class="statstrip">' + d.stats.map(function (x) {
        return '<div class="card stat ' + (x.tone === 'flat' ? '' : esc(x.tone)) + '">'
          + '<span class="s-lab">' + esc(x.label) + '</span>'
          + '<span class="s-val num">' + esc(x.value) + '</span>'
          + '<span class="s-sub">' + esc(x.sub) + '</span></div>';
      }).join('') + '</div>' : '')
    + d.sections.map(section).join('');
}

function drawTrendSparks() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-tr]'), function (el) {
    var t = TRENDS[Number(el.getAttribute('data-tr'))];
    if (!t) return;
    var W = el.clientWidth, H = el.clientHeight;
    if (!W || !H) return;
    el.innerHTML = sparkMarkup(t.series, t.lo, t.hi, W, H, 'tr-' + el.getAttribute('data-tr'));
  });
}

function stub(id) {

function openDefs() {
  var n = KPIS.filter(function (k) { return k.def === 'drafting'; }).length;
  var total = KPIS.length;
  ROLES.forEach(function (r) {
    total += r.metrics.length;
    n += r.metrics.filter(function (m) { return m.def === 'drafting'; }).length;
  });
  return n + ' of ' + total + ' measures still being defined';

function drawSparks() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-spark]'), function (el) {

function render() {

  CH.id = null;

  if (page === 'overview') {

    periodsEl.hidden = false;

    periodsEl.hidden = true;
    view.innerHTML = kpiPage();
    drawTrendSparks();
    setKpi(openKpi, false);

var menuBtn = document.getElementById('menu');

function setNav(open) {
  document.body.classList.toggle('nav-open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}

  setNav(!document.body.classList.contains('nav-open'));
});

  if (e.key !== 'Escape') return;
  if (document.body.classList.contains('nav-open')) {
    setNav(false);
    menuBtn.focus();
    return;
  }
  if (page === 'entity') {
    page = fromKpi ? 'kpi' : 'overview';

    window.scrollTo(0, 0);
    render();

    page = 'overview';

    render();
    var tile = view.querySelector('.tile[data-kpi="' + openKpi + '"]');

   same, so the two routes agree. */
function hasChart() { return page === 'overview' || page === 'kpi'; }

function tileTarget(e) {
  var t = e.target && e.target.closest ? e.target.closest('.tile') : null;
  return t ? t.getAttribute('data-kpi') : null;
}

view.addEventListener('mouseover', function (e) {
  if (page !== 'overview') return;
  var id = tileTarget(e);
  if (id && id !== CH.id) setKpi(id, true);
});

view.addEventListener('focusin', function (e) {
  if (page !== 'overview') return;
  var id = tileTarget(e);
  if (id && id !== CH.id) setKpi(id, true);
});

view.addEventListener('click', function (e) {
  var tile = e.target.closest('.tile');
  if (tile) {
    openKpi = tile.getAttribute('data-kpi');
    selectedKpi = openKpi;
    page = 'kpi';
    window.scrollTo(0, 0);
    render();
    var back = document.getElementById('back');
    if (back) back.focus();
    return;
  }

  var go = e.target.closest('[data-go]');
  if (go) {
    var bits = go.getAttribute('data-go').split(':');
    if (page === 'kpi') fromKpi = openKpi;
    openEntity = { kind: bits[0], id: bits[1] };
    page = 'entity';
    window.scrollTo(0, 0);
    render();
    var c1 = view.querySelector('.crumbs button');
    if (c1) c1.focus();
    return;
  }

  var crumb = e.target.closest('[data-crumb]');
  if (crumb) {
    var to = crumb.getAttribute('data-crumb');
    page = to === 'kpi' ? 'kpi' : 'overview';
    if (to === 'kpi') { openKpi = fromKpi; selectedKpi = fromKpi; }
    else fromKpi = null;
    window.scrollTo(0, 0);
    render();
    return;
  }

  if (e.target.closest('#back')) {
    page = 'overview';
    window.scrollTo(0, 0);
    render();
    var tileBack = view.querySelector('.tile[data-kpi="' + openKpi + '"]');
    if (tileBack) tileBack.focus();
    return;
  }

  var tab = e.target.closest('button[data-role]');
  if (tab) {
    currentRole = tab.getAttribute('data-role');
    render();
    var back = view.querySelector('button[data-role="' + currentRole + '"]');
    if (back) back.focus();
    return;
  }

  var src = e.target.closest('.src');
  if (src) {
    var row = src.closest('.mrow');
    var existing = row.querySelector('.src-panel');
    if (existing) {
      existing.remove();
      src.setAttribute('aria-expanded', 'false');
      src.textContent = 'Source';
      return;
    }
    var role = ROLES.filter(function (x) { return x.id === currentRole; })[0];
    var m = role.metrics[Number(src.getAttribute('data-src'))];
    var panel = document.createElement('div');
    panel.className = 'src-panel';
    panel.innerHTML = '<p>' + esc(m.capture) + '</p>'
      + (m.open ? '<p class="open">Open. ' + esc(m.open) + '</p>' : '');
    row.appendChild(panel);
    src.setAttribute('aria-expanded', 'true');
    src.textContent = 'Hide';
  }
});

/* The readout appears only when the pointer is near the line itself. */
view.addEventListener('pointermove', function (e) {
  if (!hasChart()) return;
  if (!e.target || !e.target.closest || !e.target.closest('#probe')) { hideReadout(); return; }
  moveReadout(e);
});

view.addEventListener('pointerleave', hideReadout, true);
view.addEventListener('pointercancel', hideReadout, true);

var resizeTimer;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    drawSparks();
    drawTrendSparks();
    if (page === 'overview') { CH.pts = null; setKpi(selectedKpi, false); }
    if (page === 'kpi') { CH.pts = null; setKpi(openKpi, false); }
    if (page === 'entity') render();
  }, 100);
});

render();
</script>
</body>
</html>
