<title>NSY Measurement Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* NSY Measurement Board.
   Dark product surface, committed to a single theme. Card idiom on a
   blue-cast near black ground, after the supplied reference. */

:root {
  color-scheme: dark;

  --bg: #0A0C10;
  --well: #0C0F14;
  --card: #10131A;
  --card-hi: #141821;
  --raise: #1B1F28;

  --line: rgba(160, 176, 210, 0.10);
  --line-hi: rgba(160, 176, 210, 0.20);

  --text: #E9ECF2;
  --muted: #8C95A6;
  --faint: #5C6577;

  --pos: #3EC27A;
  --neg: #EF5D4A;
  --hold: #D9A036;
  --blue: #6F8CFF;
  --brand: #5167F6;

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --rail: 262px;
  --r-card: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(90% 55% at 50% -12%, #12161F 0%, rgba(10, 12, 16, 0) 62%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(111, 140, 255, 0.28); }

.num { font-variant-numeric: tabular-nums; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}

:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------- Rail ---------- */

.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
  border-right: 1px solid var(--line);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rail::-webkit-scrollbar { width: 8px; }
.rail::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 999px; }
.rail::-webkit-scrollbar-track { background: transparent; }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 22px;
}

.brand-mark { height: 22px; width: auto; display: block; flex: none; }
.brand .name { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }

.nav { display: flex; flex-direction: column; gap: 2px; }

.nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 14.5px;
  color: var(--muted);
  transition: background 0.14s ease, color 0.14s ease;
}

.nav button:hover { background: rgba(255, 255, 255, 0.035); color: var(--text); }

.nav button[aria-current="page"] {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  font-weight: 500;
}

.nav svg { flex: none; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

.user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 10px 2px;
  border-top: 1px solid var(--line);
}

.avatar {
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line-hi);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.user .who { line-height: 1.3; }
.user .who b { display: block; font-size: 13.5px; font-weight: 500; }
.user .who span { font-size: 12px; color: var(--faint); }

/* ---------- Main and page head ---------- */

.main { padding: 30px 40px 72px; min-width: 0; }

.page-head {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 24px;
}

.head-left { display: flex; align-items: flex-start; gap: 14px; }

h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.page-head .sub { margin: 5px 0 0; font-size: 14px; color: var(--muted); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 11px 3px 9px;
  vertical-align: 5px;
  margin-left: 12px;
}

.pill::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 6px rgba(81, 103, 246, 0.8);
}

.head-right { text-align: right; }

.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  background: var(--well);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.seg button {
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: background 0.14s ease, color 0.14s ease;
}

.seg button:hover { color: var(--text); }

.seg button[aria-pressed="true"],
.seg button[aria-selected="true"] {
  background: var(--raise);
  color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
}

.stamp { margin: 10px 0 0; font-size: 13px; color: var(--faint); }

.menu {
  display: none;
  flex: none;
  padding: 7px;
  margin: -3px 0 0 -7px;
  border-radius: 8px;
  color: var(--muted);
}

.menu:hover { background: var(--card); color: var(--text); }

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}

/* ---------- Cards ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
}

/* ---------- Tiles ---------- */

.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.tile {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 22px 24px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  overflow: hidden;
  transition: background 0.18s ease, border-color 0.18s ease;
}

.tile:hover { background: var(--card-hi); border-color: var(--line-hi); }

.t-label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }

.t-value {
  display: block;
  font-size: 42px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: -0.035em;
  white-space: nowrap;
}

.t-value .unit {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted);
  margin-left: 4px;
}

.t-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 13px;
  color: var(--faint);
}

.delta { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
.delta.good { color: var(--pos); }
.delta.bad { color: var(--neg); }

.spark-box { display: block; height: 60px; margin-top: 12px; }
.spark-box svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- Chart card ---------- */

.detail {
  margin-top: 16px;
  padding: 24px 28px 20px;
}

.detail-head {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 26px;
}

.detail-head h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }

.legend { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--faint); }
.legend .dash { width: 20px; height: 0; border-top: 1.5px dashed var(--line-hi); }

.chart { position: relative; padding-left: 54px; padding-right: 124px; }

.plot { position: relative; height: 300px; }

.gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.gridline.target { border-top: 1.5px dashed rgba(160, 176, 210, 0.28); }

.ylabel {
  position: absolute;
  left: -54px;
  width: 42px;
  text-align: right;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--faint);
}

.plot-svg { position: absolute; inset: 0; }
.plot-svg svg { display: block; width: 100%; height: 100%; overflow: visible; }

.callout {
  position: absolute;
  left: calc(100% + 16px);
  transform: translateY(-50%);
  background: #171B24;
  border: 1px solid var(--line-hi);
  border-radius: 8px;
  padding: 5px 11px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}

.xaxis {
  position: relative;
  height: 18px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--faint);
}

.xaxis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.xaxis .x-first { transform: none; }
.xaxis .x-last { transform: translateX(-100%); color: var(--muted); }

/* ---------- Supporting measures ---------- */

.behind { margin-top: 16px; padding: 22px 28px 24px; }

.behind h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
.behind .note { margin: 0 0 18px; font-size: 13px; color: var(--muted); max-width: 76ch; }

.support {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 48px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.support li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.support .s-owner { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; }
.support .s-fig { text-align: right; white-space: nowrap; font-weight: 500; }
.support .s-fig small { display: block; font-size: 12px; font-weight: 400; color: var(--faint); }
.support .s-fig.miss small { color: var(--neg); }
.support .s-fig.hit small { color: var(--pos); }

.method {
  margin-top: 22px;
  padding: 16px 18px;
  background: var(--well);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.method p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; max-width: 84ch; color: var(--muted); }
.method p:last-child { margin-bottom: 0; }
.method p b { color: var(--text); font-weight: 500; }

/* ---------- Definition state, quiet ---------- */

.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--faint);
  white-space: nowrap;
}

.state::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-sizing: border-box;
}

.state.drafting { color: var(--hold); }
.state.manual::before { background: transparent; border: 1px solid currentColor; }

/* ---------- Team ---------- */

.role-note { margin: 18px 0 16px; font-size: 14px; color: var(--muted); max-width: 78ch; }

.rows-card { padding: 4px 24px; }

.mrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px 132px 74px;
  gap: 10px 28px;
  align-items: center;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}

.mrow:first-child { border-top: none; }

.m-name {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 14px;
  font-weight: 500;
  margin: 0;
}

.m-def { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 64ch; }

.bar { height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--pos); }
.bar.miss i { background: var(--neg); }

.m-fig { text-align: right; white-space: nowrap; }
.m-fig .v { font-size: 19px; font-weight: 500; letter-spacing: -0.02em; }
.m-fig .v.miss { color: var(--neg); }
.m-fig .t { display: block; font-size: 12px; color: var(--faint); }

.src { font-size: 13px; color: var(--faint); justify-self: end; }
.src:hover { color: var(--text); }
.src[aria-expanded="true"] { color: var(--blue); }

.src-panel { grid-column: 1 / -1; padding: 2px 0 6px 14px; border-left: 1px solid var(--line-hi); }
.src-panel p { margin: 0 0 6px; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 84ch; }
.src-panel p:last-child { margin-bottom: 0; }
.src-panel .open { color: var(--hold); }

.open-question { margin-top: 16px; padding: 22px 26px; border-color: rgba(217, 160, 54, 0.18); }
.open-question h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--hold); }
.open-question p { margin: 0 0 10px; font-size: 14px; line-height: 1.65; max-width: 80ch; color: var(--muted); }
.open-question p:last-child { margin-bottom: 0; }
.open-question p b { color: var(--text); font-weight: 500; }

.cadence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.cadence article { padding: 20px 22px; }
.cadence h4 { margin: 0 0 3px; font-size: 12px; font-weight: 500; color: var(--faint); }
.cadence .when { margin: 0 0 7px; font-size: 15px; font-weight: 500; }
.cadence p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

/* ---------- Stub pages ---------- */

.stub { padding: 28px 30px; max-width: 70ch; }
.stub h2 { margin: 0 0 8px; font-size: 19px; font-weight: 500; }
.stub p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (max-width: 1180px) {
  .support { grid-template-columns: 1fr; }
  .cadence { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }

  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 272px;
    z-index: 40;
    background: var(--bg);
    transform: translateX(-100%);
    transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
  }

  body.nav-open .rail { transform: none; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  body.nav-open { overflow: hidden; }

  .menu { display: inline-flex; }

  .main { padding: 22px 18px 56px; }
  .tiles { grid-template-columns: 1fr; }
  .detail, .behind { padding: 20px 18px 18px; }
  .chart { padding-left: 46px; padding-right: 18px; }
  .ylabel { left: -46px; width: 36px; }
  .callout { display: none; }
  .xaxis .x-minor { display: none; }
  .mrow { grid-template-columns: minmax(0, 1fr) 110px; }
  .mrow .bar { grid-column: 1; }
  .src { justify-self: start; grid-column: 1 / -1; }
}
</style>
</head>

/* ---------- Helpers ---------- */

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function icon(name) {
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + ICONS[name] + '</svg>';
}

function arrow(dir) {
  if (dir === 'up') return '<svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8H1Z" fill="currentColor"/></svg>';
  if (dir === 'down') return '<svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 8.5 1 2h8Z" fill="currentColor"/></svg>';
  return '';
}

function kpiById(id) {
  return KPIS.filter(function (x) { return x.id === id; })[0];
}

/* Monotone cubic through the points: smooth, but it never overshoots a
   value, so the curve does not invent a peak between two months. */
function monotone(pts) {
  var n = pts.length;
  if (n < 2) return '';
  var xs = pts.map(function (p) { return p[0]; });
  var ys = pts.map(function (p) { return p[1]; });
  var dx = [], m = [], t = [], i;
  for (i = 0; i < n - 1; i++) {
    dx[i] = xs[i + 1] - xs[i];
    m[i] = (ys[i + 1] - ys[i]) / (dx[i] || 1);
  }
  t[0] = m[0];
  for (i = 1; i < n - 1; i++) t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
  t[n - 1] = m[n - 2];
  for (i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    var a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { var tau = 3 / Math.sqrt(s); t[i] = tau * a * m[i]; t[i + 1] = tau * b * m[i]; }
  }
  var d = 'M' + xs[0].toFixed(2) + ' ' + ys[0].toFixed(2);
  for (i = 0; i < n - 1; i++) {
    var h = dx[i];
    d += ' C' + (xs[i] + h / 3).toFixed(2) + ' ' + (ys[i] + t[i] * h / 3).toFixed(2)
      + ',' + (xs[i + 1] - h / 3).toFixed(2) + ' ' + (ys[i + 1] - t[i + 1] * h / 3).toFixed(2)
      + ',' + xs[i + 1].toFixed(2) + ' ' + ys[i + 1].toFixed(2);
  }
  return d;
}

/* Sparklines are scaled to the metric's own range, not to the series'
   extremes, so a small drift reads as small and a large climb as large. */
function drawSpark(el, k) {
  var W = el.clientWidth, H = el.clientHeight;
  if (!W || !H) return;
  var lo = k.domain[0], hi = k.domain[1], span = hi - lo || 1;
  var padT = 8, padB = 6, padR = 6;
  var n = k.series.length;
  var pts = k.series.map(function (v, i) {
    return [(i / (n - 1)) * (W - padR), padT + (1 - (v - lo) / span) * (H - padT - padB)];
  });
  var last = pts[n - 1];
  var line = monotone(pts);
  var area = line + ' L' + last[0].toFixed(2) + ' ' + H + ' L0 ' + H + ' Z';
  var gid = 'sg-' + k.id;

  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
    + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#6F8CFF" stop-opacity="0.22"/>'
    + '<stop offset="100%" stop-color="#6F8CFF" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="' + area + '" fill="url(#' + gid + ')"/>'
    + '<path d="' + line + '" fill="none" stroke="#6F8CFF" stroke-opacity="0.85" stroke-width="1.5"'
    + ' stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="3" fill="#F4F6FA"/>'
    + '</svg>';
}

function drawChart(k) {
  var host = document.getElementById('plotSvg');
  if (!host) return;
  var plot = host.parentNode;
  var W = plot.clientWidth, H = plot.clientHeight;
  if (!W || !H) return;
  var lo = k.domain[0], hi = k.domain[1], span = hi - lo || 1;
  var n = k.series.length;
  var pts = k.series.map(function (v, i) {
    return [(i / (n - 1)) * W, (1 - (v - lo) / span) * H];
  });
  var last = pts[n - 1];
  var line = monotone(pts);
  var area = line + ' L' + W + ' ' + H + ' L0 ' + H + ' Z';

  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
    + '<defs>'
    + '<linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#6F8CFF" stop-opacity="0.26"/>'
    + '<stop offset="100%" stop-color="#6F8CFF" stop-opacity="0"/>'
    + '</linearGradient>'
    + '<filter id="glow" x="-10%" y="-40%" width="120%" height="180%">'
    + '<feGaussianBlur stdDeviation="6"/></filter>'
    + '</defs>'
    + '<path d="' + area + '" fill="url(#cg)"/>'
    + '<path d="' + line + '" fill="none" stroke="#6F8CFF" stroke-opacity="0.32" stroke-width="10"'
    + ' stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>'
    + '<path d="' + line + '" fill="none" stroke="#7D97FF" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="9" fill="#6F8CFF" fill-opacity="0.22"/>'
    + '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="5.5" fill="#0A0C10" stroke="#7D97FF" stroke-width="2"/>'
    + '</svg>';
}

function drawAll() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-spark]'), function (el) {
    drawSpark(el, kpiById(el.getAttribute('data-spark')));
  });
  if (page === 'overview') drawChart(kpiById(selectedKpi));
}

function chart(k) {
  var lo = k.domain[0], hi = k.domain[1], span = hi - lo || 1;
  var yOf = function (v) { return (1 - (v - lo) / span) * 100; };

  var grid = k.ticks.map(function (t) {
    return '<div class="gridline" style="top:' + yOf(t).toFixed(2) + '%"></div>'
      + '<div class="ylabel" style="top:' + yOf(t).toFixed(2) + '%">' + esc(k.fmt(t)) + '</div>';
  }).join('');

  var targetLine = k.target === null ? ''
    : '<div class="gridline target" style="top:' + yOf(k.target).toFixed(2) + '%"></div>';

  var endTop = yOf(k.series[k.series.length - 1]);

  return '<div class="detail-head">'
    + '<h2>' + esc(k.chartTitle) + '</h2>'
    + '<span class="legend">' + (k.target === null ? '' : '<span class="dash"></span>')
    + esc(k.targetLabel) + '</span>'
    + '</div>'
    + '<div class="chart">'
    + '<div class="plot">'
    + grid + targetLine
    + '<div class="plot-svg" id="plotSvg"></div>'
    + '<span class="callout num" style="top:' + endTop.toFixed(2) + '%">'
    + esc(k.value + k.unit) + '</span>'
    + '</div>'
    + '<div class="xaxis">' + MONTHS.map(function (m, i) {
        var n = MONTHS.length - 1;
        var cls = i === 0 ? 'x-first' : i === n ? 'x-last' : (i % 3 === 0 ? '' : 'x-minor');
        return '<span class="' + cls + '" style="left:' + ((i / n) * 100).toFixed(3) + '%">' + m + '</span>';
      }).join('') + '</div>'
    + '</div>';
}

function behind(k) {
  return '<h3>Behind ' + esc(k.label.toLowerCase()) + '</h3>'
    + '<p class="note">Owned by ' + esc(k.owner) + '. '
    + 'These are the weekly inputs the team controls. The KPI above moves when these move.</p>'
    + '<ul class="support">'
    + k.support.map(function (s) {
        return '<li><span>' + esc(s.name) + '<span class="s-owner">' + esc(s.owner) + '</span></span>'
          + '<span class="s-fig num ' + (s.hit ? 'hit' : 'miss') + '">' + esc(s.v)
          + '<small>' + esc(s.t) + '</small></span></li>';
      }).join('')
    + '</ul>'
    + '<div class="method">'
    + '<p><b>How this is counted.</b> ' + esc(k.definition) + '</p>'
    + '<p>' + esc(k.capture) + '</p>'
    + '<p><span class="state ' + k.def + '">' + esc(STATE[k.def]) + '</span></p>'
    + '</div>';
}

          + '<span class="delta ' + (t.delta.good ? 'good' : 'bad') + '">'
          + arrow(t.delta.dir) + esc(t.delta.text) + '</span>'
          + '<span>' + esc(t.context) + '</span>'
          + '</span>'
          + '<span class="spark-box" data-spark="' + t.id + '"></span>'
          + '</button>';
      }).join('')
    + '</div>'
    + '<section class="card detail">' + chart(k) + '</section>'
    + '<section class="card behind">' + behind(k) + '</section>';
}

function team() {
  var r = ROLES.filter(function (x) { return x.id === currentRole; })[0];

  return '<div class="seg" role="tablist" aria-label="Role">'
    + ROLES.map(function (x) {
        return '<button type="button" role="tab" data-role="' + x.id + '"'
          + ' aria-selected="' + (x.id === currentRole) + '">' + esc(x.name) + '</button>';
      }).join('')
    + '</div>'
    + '<p class="role-note">' + esc(r.blurb) + '</p>'
    + '<div class="card rows-card" id="rows">'
    + r.metrics.map(function (m, i) {
        var w = Math.min(m.pct, 100);
        return '<div class="mrow" data-row="' + i + '">'
          + '<div><p class="m-name">' + esc(m.name)
          + '<span class="state ' + m.def + '">' + esc(STATE[m.def]) + '</span></p>'
          + '<p class="m-def">' + esc(m.definition) + '</p></div>'
          + '<span class="bar' + (m.hit ? '' : ' miss') + '"><i style="width:' + w + '%"></i></span>'
          + '<span class="m-fig"><span class="v num' + (m.hit ? '' : ' miss') + '">' + esc(m.v) + '</span>'
          + '<span class="t num">' + esc(m.t) + '</span></span>'
          + '<button type="button" class="src" data-src="' + i + '" aria-expanded="false">Source</button>'
          + '</div>';
      }).join('')
    + '</div>'
    + '<div class="card open-question">'
    + '<h3>Open before this goes live</h3>'
    + '<p>An edit is currently anything an editor marks Delivered in Notion. A sixty second cut and a five minute cut count the same, so the five a day target means different work for different people.</p>'
    + '<p><b>Three tiers, or two. Where does a tier stop. Who assigns it, and at what point in the pipeline.</b> Answer those and the editing numbers become objective.</p>'
    + '</div>'
    + '<div class="cadence">'
    + '<article class="card"><h4>Monday</h4><p class="when">Plan</p>'
    + '<p>Leads open this view, read last week against target, and set the week. Fifteen minutes, no deck.</p></article>'
    + '<article class="card"><h4>Friday</h4><p class="when">Report</p>'
    + '<p>Each lead files the week. Anything below target carries one line on what changes next week.</p></article>'
    + '<article class="card"><h4>Month end</h4><p class="when">Roll up</p>'
    + '<p>Weekly inputs roll into the business KPIs. Nativ and the fractional CFO review the six.</p></article>'
    + '</div>';
}

function stub(id) {
  return '<div class="card stub"><h2>' + esc(STUBS[id][0]) + '</h2><p>' + esc(STUBS[id][1]) + '</p></div>';
}

function openDefs() {
  var n = KPIS.filter(function (k) { return k.def === 'drafting'; }).length;
  var total = KPIS.length;
  ROLES.forEach(function (r) {
    total += r.metrics.length;
    n += r.metrics.filter(function (m) { return m.def === 'drafting'; }).length;
  });
  return n + ' of ' + total + ' measures still being defined';
}

function render() {
  var period = PERIODS.filter(function (p) { return p.id === currentPeriod; })[0];

  if (page === 'overview') {
    titleEl.innerHTML = 'Performance <span class="pill">Placeholder data</span>';
    subEl.textContent = period.sub;
    headRight.hidden = false;
    view.innerHTML = overview();
  } else if (page === 'team') {
    titleEl.innerHTML = 'Team <span class="pill">Placeholder data</span>';
    subEl.textContent = 'Weekly leading indicators. ' + openDefs() + '.';
    headRight.hidden = false;
    view.innerHTML = team();
  } else {
    titleEl.textContent = STUBS[page][0];
    subEl.textContent = 'Not built yet.';
    headRight.hidden = true;
    view.innerHTML = stub(page);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.nav button'), function (b) {
    if (b.getAttribute('data-page') === page) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });

  drawAll();
}

/* ---------- Rail ---------- */

var NAV = [
  { id: 'search', label: 'Search', icon: 'search' },
  { id: 'overview', label: 'Overview', icon: 'overview' },
  { id: 'clients', label: 'Clients', icon: 'clients' },
  { id: 'team', label: 'Team', icon: 'team' },
  { id: 'delivery', label: 'Delivery', icon: 'delivery' },
  { id: 'finance', label: 'Finance', icon: 'finance' },
  { id: 'reports', label: 'Reports', icon: 'reports' }
];

function navButton(item) {
  return '<button type="button" data-page="' + item.id + '">'
    + icon(item.icon) + '<span>' + esc(item.label) + '</span></button>';
}

document.getElementById('nav').innerHTML = NAV.map(navButton).join('');
document.getElementById('navFoot').innerHTML = navButton({ id: 'settings', label: 'Settings', icon: 'settings' });
STUBS.settings = ['Settings', 'Workspace, people and permissions. Editors see their own row, leads see their team, Nativ sees everything.'];

var menuBtn = document.getElementById('menu');

function setNav(open) {
  document.body.classList.toggle('nav-open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}

menuBtn.addEventListener('click', function () {
  setNav(!document.body.classList.contains('nav-open'));
});

document.getElementById('scrim').addEventListener('click', function () { setNav(false); });

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') setNav(false);
});

document.querySelector('.rail').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-page]');
  if (!btn) return;
  page = btn.getAttribute('data-page');
  setNav(false);
  render();
});

/* ---------- Periods ---------- */

document.getElementById('periods').innerHTML = PERIODS.map(function (p) {
  return '<button type="button" aria-pressed="' + (p.id === currentPeriod) + '">' + p.id + '</button>';
}).join('');

document.getElementById('periods').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  currentPeriod = btn.textContent.trim();
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
    b.setAttribute('aria-pressed', String(b === btn));
  });
  var period = PERIODS.filter(function (p) { return p.id === currentPeriod; })[0];
  if (page === 'overview') subEl.textContent = period.sub;
});

/* ---------- View interaction ---------- */

view.addEventListener('click', function (e) {
  var tile = e.target.closest('.tile');
  if (tile) {
    selectedKpi = tile.getAttribute('data-kpi');
    render();
    return;
  }

  var tab = e.target.closest('button[data-role]');
  if (tab) {
    currentRole = tab.getAttribute('data-role');
    render();
    return;
  }

  var src = e.target.closest('.src');
  if (src) {
    var row = src.closest('.mrow');
    var existing = row.querySelector('.src-panel');
    if (existing) {
      existing.remove();
      src.setAttribute('aria-expanded', 'false');
      src.textContent = 'Source';
      return;
    }
    var role = ROLES.filter(function (x) { return x.id === currentRole; })[0];
    var m = role.metrics[Number(src.getAttribute('data-src'))];
    var panel = document.createElement('div');
    panel.className = 'src-panel';
    panel.innerHTML = '<p>' + esc(m.capture) + '</p>'
      + (m.open ? '<p class="open">Open. ' + esc(m.open) + '</p>' : '');
    row.appendChild(panel);
    src.setAttribute('aria-expanded', 'true');
    src.textContent = 'Hide';
  }
});

var resizeTimer;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawAll, 80);
});

render();
</script>
</body>
</html>
