<title>NSY Measurement Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* NSY Measurement Board.
   Dark product surface, committed to a single theme: it paints its own
   ground rather than following the host light or dark setting. */

:root {
  --bg: #08090A;
  --panel: #101113;
  --panel-hi: #17191C;
  --line: rgba(255, 255, 255, 0.07);
  --line-hi: rgba(255, 255, 255, 0.12);

  --text: #ECEDEE;
  --muted: #8B9099;
  --faint: #5A606A;

  --pos: #3FB950;
  --neg: #F0603D;
  --hold: #D9A036;
  --plot: #5B8DEF;

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --rail: 268px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(120% 70% at 50% -10%, #12151A 0%, rgba(8, 9, 10, 0) 62%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.num { font-variant-numeric: tabular-nums; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}

:focus-visible {
  outline: 1px solid var(--plot);
  outline-offset: 2px;
  border-radius: 4px;
}

.app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------- Rail ---------- */

.rail {
  border-right: 1px solid var(--line);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.brand { padding: 10px 10px 24px; }

/* The NSY lockup, reversed for a dark ground: the mark keeps its blue,
   the wordmark flips from black to cream. */
.brand-mark { height: 40px; width: auto; display: block; }

.avatar {
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav { display: flex; flex-direction: column; gap: 1px; }

.nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 14px;
  color: var(--muted);
  transition: background 0.12s ease, color 0.12s ease;
}

.nav button:hover { background: var(--panel); color: var(--text); }

.nav button[aria-current="page"] {
  background: var(--panel-hi);
  color: var(--text);
  font-weight: 500;
}

.nav svg { flex: none; }

.rail-foot {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 2px;
  border-top: 1px solid var(--line);
}

.user .who { line-height: 1.3; }
.user .who b { display: block; font-size: 13px; font-weight: 500; }
.user .who span { font-size: 12px; color: var(--faint); }

/* ---------- Main ---------- */

.main { padding: 30px 48px 88px; min-width: 0; }

.page-head {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 26px;
}

h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.025em;
}

.page-head .sub {
  margin: 5px 0 0;
  font-size: 14px;
  color: var(--muted);
}

.head-right { text-align: right; }

.periods {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.periods button {
  padding: 5px 13px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: background 0.12s ease, color 0.12s ease;
}

.periods button:hover { color: var(--text); }
.periods button[aria-pressed="true"] { background: var(--panel-hi); color: var(--text); }

.stamp { margin: 9px 0 0; font-size: 13px; color: var(--faint); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--faint);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
  vertical-align: 4px;
  margin-left: 12px;
  font-weight: 400;
}

.pill::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--hold);
}

/* ---------- Tile grid ---------- */

.tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 0 -22px;
}

.tile {
  display: block;
  width: 100%;
  padding: 22px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.tile:hover {
  background: rgba(255, 255, 255, 0.028);
  border-color: rgba(255, 255, 255, 0.09);
}

.tile:hover .t-label { color: var(--text); }

.t-label {
  display: block;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 12px;
}

.t-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.t-value {
  font-size: 41px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: -0.04em;
  white-space: nowrap;
}

.t-value .unit {
  font-size: 17px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted);
  margin-left: 3px;
}

.t-foot {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 13px;
  color: var(--faint);
}

.delta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 500;
}

.delta.up { color: var(--pos); }
.delta.down { color: var(--neg); }
.delta.flat { color: var(--muted); }

.spark { flex: none; }

/* ---------- Detail block ---------- */

.detail {
  margin-top: 34px;
  padding-top: 34px;
  border-top: 1px solid var(--line);
}

.detail-head {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 26px;
}

.detail-head h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.legend {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  color: var(--faint);
}

.legend .dash {
  width: 22px;
  height: 0;
  border-top: 1px dashed var(--line-hi);
}

/* ---------- Chart ---------- */

.chart {
  position: relative;
  padding-left: 62px;
  padding-right: 96px;
}

.plot { position: relative; height: 280px; }

.gridline {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid var(--line);
}

.gridline.target { border-top: 1px dashed var(--line-hi); }

.ylabel {
  position: absolute;
  left: -62px;
  width: 50px;
  text-align: right;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--faint);
}

.plot svg { display: block; width: 100%; height: 100%; }

.endpoint {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--plot);
  transform: translate(50%, -50%);
  right: 0;
}

.callout {
  position: absolute;
  right: -84px;
  transform: translateY(-50%);
  background: var(--panel-hi);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}

.xaxis {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 12px;
  color: var(--faint);
}

.xaxis span:last-child { color: var(--muted); }

/* ---------- Supporting measures ---------- */

.behind {
  margin-top: 42px;
  padding-top: 26px;
  border-top: 1px solid var(--line);
}

.behind h3 {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 500;
}

.behind .note {
  margin: 0 0 20px;
  font-size: 13px;
  color: var(--muted);
  max-width: 76ch;
}

.support {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 48px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.support li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.support .s-owner { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; }
.support .s-fig { text-align: right; white-space: nowrap; font-weight: 500; }
.support .s-fig small { display: block; font-size: 12px; font-weight: 400; color: var(--faint); }
.support .s-fig.miss small { color: var(--neg); }
.support .s-fig.hit small { color: var(--pos); }

.method {
  margin-top: 26px;
  padding: 16px 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.method p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; max-width: 84ch; color: var(--muted); }
.method p:last-child { margin-bottom: 0; }
.method p b { color: var(--text); font-weight: 500; }

/* ---------- Definition state ---------- */

.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--faint);
  white-space: nowrap;
}

.state::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.state.agreed { color: var(--pos); }
.state.drafting { color: var(--hold); }
.state.manual { color: var(--faint); }

/* ---------- Team ---------- */

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}

.tabs button {
  padding: 6px 13px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

.tabs button:hover { background: var(--panel); color: var(--text); }
.tabs button[aria-selected="true"] { background: var(--panel-hi); color: var(--text); }

.role-note {
  margin: 18px 0 22px;
  font-size: 14px;
  color: var(--muted);
  max-width: 78ch;
}

.mrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 116px 132px 78px;
  gap: 10px 28px;
  align-items: center;
  padding: 15px 0;
  border-top: 1px solid var(--line);
}

.mrow:last-of-type { border-bottom: 1px solid var(--line); }

.m-name {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 14px;
  font-weight: 500;
  margin: 0;
}
.m-def { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 64ch; }

.bar {
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.bar i { display: block; height: 100%; border-radius: 999px; background: var(--pos); }
.bar.miss i { background: var(--neg); }

.m-fig { text-align: right; white-space: nowrap; }
.m-fig .v { font-size: 19px; font-weight: 500; letter-spacing: -0.02em; }
.m-fig .v.miss { color: var(--neg); }
.m-fig .t { display: block; font-size: 12px; color: var(--faint); }

.src {
  font-size: 13px;
  color: var(--faint);
  justify-self: end;
}

.src:hover { color: var(--text); }
.src[aria-expanded="true"] { color: var(--plot); }

.src-panel {
  grid-column: 1 / -1;
  padding: 2px 0 6px 14px;
  border-left: 1px solid var(--line-hi);
}

.src-panel p { margin: 0 0 6px; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 84ch; }
.src-panel p:last-child { margin-bottom: 0; }
.src-panel .open { color: var(--hold); }

.open-question {
  margin-top: 34px;
  padding: 20px 22px;
  background: var(--panel);
  border: 1px solid rgba(217, 160, 54, 0.26);
  border-radius: 8px;
}

.open-question h3 {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--hold);
}

.open-question p { margin: 0 0 10px; font-size: 14px; line-height: 1.65; max-width: 80ch; color: var(--muted); }
.open-question p:last-child { margin-bottom: 0; }
.open-question p b { color: var(--text); font-weight: 500; }

.cadence {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 26px;
}

.cadence article {
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.cadence h4 { margin: 0 0 3px; font-size: 12px; font-weight: 500; color: var(--faint); }
.cadence .when { margin: 0 0 7px; font-size: 15px; font-weight: 500; }
.cadence p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

/* ---------- Stub pages ---------- */

.stub {
  padding: 56px 0;
  max-width: 62ch;
}

.stub h2 { margin: 0 0 8px; font-size: 19px; font-weight: 500; }
.stub p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (max-width: 1180px) {
  .support { grid-template-columns: 1fr; }
  .cadence { grid-template-columns: 1fr; }
}

@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    border-right: none;
    border-bottom: 1px solid var(--line);
    flex-direction: row;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .workspace { width: auto; margin-bottom: 0; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .rail-foot { margin-top: 0; }
  .user { border-top: none; padding-top: 0; }
  .main { padding: 22px 20px 56px; }
  .tiles { grid-template-columns: 1fr; margin: 0; }
  .chart { padding-right: 20px; }
  .callout { display: none; }
  .mrow { grid-template-columns: minmax(0, 1fr) 110px; }
  .mrow .bar { grid-column: 1; }
  .src { justify-self: start; grid-column: 1 / -1; }
}
</style>
</head>

var PERIODS = [

var STUBS = {
  clients: ['Clients', 'The account list, one row per client, with retention, satisfaction and the last check in date. Reads from the same Notion sync as the board.'],
  delivery: ['Delivery', 'The edit pipeline. Throughput, on time rate and the queue by editor. This is the page that cannot be built until an edit has one agreed definition.'],
  finance: ['Finance', 'Retainer value, delivery margin and cash runway. Owned by the fractional CFO rather than pulled from Notion.'],
  reports: ['Reports', 'The Friday report and the month end roll up, written once and shared rather than rebuilt each time.'],

};

var ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  overview: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  clients: '<rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M8.5 7V5.5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2V7"/>',
  team: '<circle cx="9" cy="8" r="3.2"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.5 5.2a3.2 3.2 0 0 1 0 6"/><path d="M18 14.4a6.2 6.2 0 0 1 3.2 5.6"/>',
  delivery: '<path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="m4 7 8 4 8-4"/><path d="M12 11v10"/>',
  finance: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/>',
  reports: '<path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/>',
  settings: '<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/>'
};

/* ---------- Helpers ---------- */

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function icon(name) {
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + ICONS[name] + '</svg>';
}

function arrow(dir) {
  if (dir === 'up') return '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9 8H1Z" fill="currentColor"/></svg>';
  if (dir === 'down') return '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 9 1 2h8Z" fill="currentColor"/></svg>';
  return '';
}

/* A soft curve through the points, in the manner of the reference. */
function curve(points) {
  if (points.length < 2) return '';
  var d = 'M' + points[0][0].toFixed(2) + ' ' + points[0][1].toFixed(2);
  for (var i = 0; i < points.length - 1; i++) {
    var p0 = points[i > 0 ? i - 1 : 0];
    var p1 = points[i];
    var p2 = points[i + 1];
    var p3 = points[i + 2 < points.length ? i + 2 : i + 1];
    var c1x = p1[0] + (p2[0] - p0[0]) / 6;
    var c1y = p1[1] + (p2[1] - p0[1]) / 6;
    var c2x = p2[0] - (p3[0] - p1[0]) / 6;
    var c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ' C' + c1x.toFixed(2) + ' ' + c1y.toFixed(2)
      + ',' + c2x.toFixed(2) + ' ' + c2y.toFixed(2)
      + ',' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2);
  }
  return d;
}

function sparkline(series) {
  var w = 104, h = 30, pad = 3;
  var min = Math.min.apply(null, series);
  var max = Math.max.apply(null, series);
  var span = max - min || 1;
  var pts = series.map(function (v, i) {
    return [
      (i / (series.length - 1)) * w,
      pad + (1 - (v - min) / span) * (h - pad * 2)
    ];
  });
  var last = pts[pts.length - 1];
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">'
    + '<path d="' + curve(pts) + '" fill="none" stroke="#6E747E" stroke-width="1.25"'
    + ' stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="2.1" fill="#ECEDEE"/>'
    + '</svg>';
}

function chart(k) {
  var h = 280;
  var lo = k.domain[0], hi = k.domain[1];
  var span = hi - lo || 1;
  var yOf = function (v) { return (1 - (v - lo) / span) * 100; };

  var pts = k.series.map(function (v, i) {
    return [(i / (k.series.length - 1)) * 1000, (1 - (v - lo) / span) * h];
  });
  var line = curve(pts);
  var area = line + ' L1000 ' + h + ' L0 ' + h + ' Z';

  var grid = k.ticks.map(function (t) {
    return '<div class="gridline" style="top:' + yOf(t).toFixed(2) + '%"></div>'
      + '<div class="ylabel" style="top:' + yOf(t).toFixed(2) + '%">' + esc(k.fmt(t)) + '</div>';
  }).join('');

  var targetLine = k.target === null ? ''
    : '<div class="gridline target" style="top:' + yOf(k.target).toFixed(2) + '%"></div>';

  var endTop = yOf(k.series[k.series.length - 1]);

  return '<div class="detail-head">'
    + '<h2>' + esc(k.chartTitle) + '</h2>'
    + '<span class="legend">' + (k.target === null ? '' : '<span class="dash"></span>')
    + esc(k.targetLabel) + '</span>'
    + '</div>'
    + '<div class="chart">'
    + '<div class="plot">'
    + grid + targetLine
    + '<svg viewBox="0 0 1000 ' + h + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<defs><linearGradient id="fill-' + k.id + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.24"/>'
    + '<stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="' + area + '" fill="url(#fill-' + k.id + ')"/>'
    + '<path d="' + line + '" fill="none" stroke="#5B8DEF" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '</svg>'
    + '<span class="endpoint" style="top:' + endTop.toFixed(2) + '%"></span>'
    + '<span class="callout num" style="top:' + endTop.toFixed(2) + '%">'
    + esc(k.value + k.unit) + '</span>'
    + '</div>'
    + '<div class="xaxis">' + MONTHS.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>'
    + '</div>';
}

function behind(k) {
  return '<div class="behind">'
    + '<h3>Behind ' + esc(k.label.toLowerCase()) + '</h3>'
    + '<p class="note">Owned by ' + esc(k.owner) + '. '
    + 'These are the weekly inputs the team controls. The KPI above moves when these move.</p>'
    + '<ul class="support">'
    + k.support.map(function (s) {
        return '<li><span>' + esc(s.name) + '<span class="s-owner">' + esc(s.owner) + '</span></span>'
          + '<span class="s-fig num ' + (s.hit ? 'hit' : 'miss') + '">' + esc(s.v)
          + '<small>' + esc(s.t) + '</small></span></li>';
      }).join('')
    + '</ul>'
    + '<div class="method">'
    + '<p><b>How this is counted.</b> ' + esc(k.definition) + '</p>'
    + '<p>' + esc(k.capture) + '</p>'
    + '<p><span class="state ' + k.def + '">' + esc(STATE[k.def]) + '</span></p>'
    + '</div>'
    + '</div>';
}

/* ---------- Views ---------- */

var selectedKpi = 'mrr';
var currentRole = ROLES[0].id;
var currentPeriod = 'MTD';
var page = 'overview';

var view = document.getElementById('view');
var titleEl = document.getElementById('pageTitle');
var subEl = document.getElementById('pageSub');
var headRight = document.querySelector('.head-right');

function overview() {
  var k = KPIS.filter(function (x) { return x.id === selectedKpi; })[0];

  return '<div class="tiles">'
    + KPIS.map(function (t) {
        return '<button type="button" class="tile" data-kpi="' + t.id + '">'
          + '<span class="t-label">' + esc(t.label) + '</span>'
          + '<span class="t-row">'
          + '<span class="t-value num">' + esc(t.value)
          + (t.unit ? '<span class="unit">' + esc(t.unit) + '</span>' : '') + '</span>'
          + sparkline(t.series)
          + '</span>'
          + '<span class="t-foot">'
          + '<span class="delta ' + t.delta.dir + (t.delta.good ? '' : ' bad') + '"'
          + ' style="color:' + (t.delta.good ? 'var(--pos)' : 'var(--neg)') + '">'
          + arrow(t.delta.dir) + esc(t.delta.text) + '</span>'
          + '<span>' + esc(t.context) + '</span>'
          + '</span>'
          + '</button>';
      }).join('')
    + '</div>'
    + '<div class="detail">' + chart(k) + behind(k) + '</div>';
}

function team() {
  var r = ROLES.filter(function (x) { return x.id === currentRole; })[0];

  return '<div class="tabs" role="tablist" aria-label="Role">'
    + ROLES.map(function (x) {
        return '<button type="button" role="tab" data-role="' + x.id + '"'
          + ' aria-selected="' + (x.id === currentRole) + '">' + esc(x.name) + '</button>';
      }).join('')
    + '</div>'
    + '<p class="role-note">' + esc(r.blurb) + '</p>'
    + '<div id="rows">'
    + r.metrics.map(function (m, i) {
        var w = Math.min(m.pct, 100);
        return '<div class="mrow" data-row="' + i + '">'
          + '<div><p class="m-name">' + esc(m.name)
          + '<span class="state ' + m.def + '">' + esc(STATE[m.def]) + '</span></p>'
          + '<p class="m-def">' + esc(m.definition) + '</p></div>'
          + '<span class="bar' + (m.hit ? '' : ' miss') + '"><i style="width:' + w + '%"></i></span>'
          + '<span class="m-fig"><span class="v num' + (m.hit ? '' : ' miss') + '">' + esc(m.v) + '</span>'
          + '<span class="t num">' + esc(m.t) + '</span></span>'
          + '<button type="button" class="src" data-src="' + i + '" aria-expanded="false">Source</button>'
          + '</div>';
      }).join('')
    + '</div>'
    + '<div class="open-question">'
    + '<h3>Open before this goes live</h3>'
    + '<p>An edit is currently anything an editor marks Delivered in Notion. A sixty second cut and a five minute cut count the same, so the five a day target means different work for different people.</p>'
    + '<p><b>Three tiers, or two. Where does a tier stop. Who assigns it, and at what point in the pipeline.</b> Answer those and the editing numbers become objective.</p>'
    + '</div>'
    + '<div class="cadence">'
    + '<article><h4>Monday</h4><p class="when">Plan</p>'
    + '<p>Leads open this view, read last week against target, and set the week. Fifteen minutes, no deck.</p></article>'
    + '<article><h4>Friday</h4><p class="when">Report</p>'
    + '<p>Each lead files the week. Anything below target carries one line on what changes next week.</p></article>'
    + '<article><h4>Month end</h4><p class="when">Roll up</p>'
    + '<p>Weekly inputs roll into the business KPIs. Nativ and the fractional CFO review the six.</p></article>'
    + '</div>';
}

function stub(id) {
  return '<div class="stub"><h2>' + esc(STUBS[id][0]) + '</h2><p>' + esc(STUBS[id][1]) + '</p></div>';
}

function openDefs() {
  var n = KPIS.filter(function (k) { return k.def === 'drafting'; }).length;
  var total = KPIS.length;
  ROLES.forEach(function (r) {
    total += r.metrics.length;
    n += r.metrics.filter(function (m) { return m.def === 'drafting'; }).length;
  });
  return n + ' of ' + total + ' measures still being defined';
}

function render() {
  var period = PERIODS.filter(function (p) { return p.id === currentPeriod; })[0];

  if (page === 'overview') {
    titleEl.innerHTML = 'Performance <span class="pill">Placeholder data</span>';
    subEl.textContent = period.sub;
    headRight.hidden = false;
    view.innerHTML = overview();
  } else if (page === 'team') {
    titleEl.innerHTML = 'Team <span class="pill">Placeholder data</span>';
    subEl.textContent = 'Weekly leading indicators. ' + openDefs() + '.';
    headRight.hidden = false;
    view.innerHTML = team();
  } else {
    titleEl.textContent = STUBS[page][0];
    subEl.textContent = 'Not built yet.';
    headRight.hidden = true;
    view.innerHTML = stub(page);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.nav button'), function (b) {
    if (b.getAttribute('data-page') === page) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

/* ---------- Rail ---------- */

var NAV = [
  { id: 'search', label: 'Search', icon: 'search' },
  { id: 'overview', label: 'Overview', icon: 'overview' },
  { id: 'clients', label: 'Clients', icon: 'clients' },
  { id: 'team', label: 'Team', icon: 'team' },
  { id: 'delivery', label: 'Delivery', icon: 'delivery' },
  { id: 'finance', label: 'Finance', icon: 'finance' },
  { id: 'reports', label: 'Reports', icon: 'reports' }
];

function navButton(item) {
  return '<button type="button" data-page="' + item.id + '">'
    + icon(item.icon) + '<span>' + esc(item.label) + '</span></button>';
}

document.getElementById('nav').innerHTML = NAV.map(navButton).join('');
document.getElementById('navFoot').innerHTML = navButton({ id: 'settings', label: 'Settings', icon: 'settings' });
STUBS.settings = ['Settings', 'Workspace, people and permissions. Editors see their own row, leads see their team, Nativ sees everything.'];

document.querySelector('.rail').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-page]');
  if (!btn) return;
  page = btn.getAttribute('data-page');
  render();
});

/* ---------- Periods ---------- */

document.getElementById('periods').innerHTML = PERIODS.map(function (p) {
  return '<button type="button" aria-pressed="' + (p.id === currentPeriod) + '">' + p.id + '</button>';
}).join('');

document.getElementById('periods').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  currentPeriod = btn.textContent.trim();
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
    b.setAttribute('aria-pressed', String(b === btn));
  });
  var period = PERIODS.filter(function (p) { return p.id === currentPeriod; })[0];
  if (page === 'overview') subEl.textContent = period.sub;
});

/* ---------- View interaction ---------- */

view.addEventListener('click', function (e) {
  var tile = e.target.closest('.tile');
  if (tile) {
    selectedKpi = tile.getAttribute('data-kpi');
    render();
    return;
  }

  var tab = e.target.closest('button[data-role]');
  if (tab) {
    currentRole = tab.getAttribute('data-role');
    render();
    return;
  }

  var src = e.target.closest('.src');
  if (src) {
    var row = src.closest('.mrow');
    var existing = row.querySelector('.src-panel');
    if (existing) {
      existing.remove();
      src.setAttribute('aria-expanded', 'false');
      src.textContent = 'Source';
      return;
    }
    var role = ROLES.filter(function (x) { return x.id === currentRole; })[0];
    var m = role.metrics[Number(src.getAttribute('data-src'))];
    var panel = document.createElement('div');
    panel.className = 'src-panel';
    panel.innerHTML = '<p>' + esc(m.capture) + '</p>'
      + (m.open ? '<p class="open">Open. ' + esc(m.open) + '</p>' : '');
    row.appendChild(panel);
    src.setAttribute('aria-expanded', 'true');
    src.textContent = 'Hide';
  }
});

render();
</script>
